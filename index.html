<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Taxi Arcade</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        html, body {
            margin:0; width:100%; height:100%; overflow:hidden;
            background:#02040a; color:#eafcff;
            font-family:'Oxanium',sans-serif;
        }
        body { display:flex; justify-content:center; align-items:center; }
        #game-container {
            position:relative; width:100%; max-width:420px; height:100%; max-height:100vh;
            background:#050914; overflow:hidden; border:1px solid #26334a;
            box-shadow:0 0 0 1px rgba(255,255,255,.03), 0 22px 70px rgba(0,0,0,.7);
        }
        canvas { display:block; width:100%; flex-grow:1; background:#060a12; }
        .ui-layer {
            position:absolute; inset:0 0 auto 0; padding:14px 14px 0;
            display:flex; flex-direction:column; gap:8px; pointer-events:none; z-index:5;
        }
        .header-hud {
            display:flex; justify-content:space-between; align-items:center;
            font-size:20px; font-weight:700; letter-spacing:2px;
            text-shadow:0 2px 10px rgba(0,0,0,.8);
        }
        #scoreDisplay { color:#f4fbff; }
        #speedDisplay {
            color:#5cf5d2 !important; font-size:16px; padding:5px 9px;
            border:1px solid rgba(92,245,210,.35); background:rgba(4,12,18,.72);
            border-radius:6px;
        }
        .status-hud {
            display:flex; justify-content:space-between; align-items:center;
            font-family:'VT323',monospace; font-size:17px; letter-spacing:1px;
            color:#b8c7d9; padding:7px 10px; border-radius:7px;
            background:rgba(4,8,15,.72); border:1px solid rgba(148,163,184,.16);
            backdrop-filter:blur(5px);
        }
        #activePowerup { color:#ffbd69 !important; }
        .mobile-controls {
            display:flex; width:100%; height:82px; background:#070b13;
            border-top:1px solid #243047; flex-shrink:0; padding:8px; gap:8px;
        }
        .control-btn {
            flex:1; border:1px solid #27344b; border-radius:9px;
            background:linear-gradient(#101827,#0b111d); color:#c7d4e4;
            font-family:'Oxanium',sans-serif; font-size:17px; font-weight:700;
            letter-spacing:2px; cursor:pointer;
            box-shadow:inset 0 1px rgba(255,255,255,.05);
            transition:transform .08s, background .08s, border-color .08s;
        }
        .control-btn:active {
            transform:translateY(2px); background:#172338; border-color:#4fe7cb;
            color:#fff;
        }
        .screen {
            position:absolute; inset:0; background:
                radial-gradient(circle at 50% 40%, rgba(19,42,61,.45), transparent 45%),
                linear-gradient(180deg,rgba(2,4,10,.86),rgba(2,4,10,.97));
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            text-align:center; padding:24px; z-index:10;
        }
        h1 {
            font-family:'VT323',monospace; font-size:64px; line-height:.8; margin:0 0 16px;
            color:#f3fbff; letter-spacing:5px;
            text-shadow:0 0 0 #fff, 0 0 22px rgba(82,236,214,.32);
        }
        .screen p {
            max-width:280px; color:#8fa4ba; font-size:17px; line-height:1.25;
            margin:0 0 30px; letter-spacing:1px;
        }
        .btn {
            border:1px solid #5cf5d2; border-radius:7px;
            background:#5cf5d2; color:#04100e; padding:12px 34px;
            font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700;
            letter-spacing:2px; cursor:pointer;
            box-shadow:0 0 24px rgba(92,245,210,.16);
        }
        .btn:active { transform:scale(.97); }
        .hidden { display:none !important; }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas Game -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Layer -->
        <div class="ui-layer">
            <div class="header-hud">
                <span id="scoreDisplay">SCORE: 0000</span>
                <span id="speedDisplay" style="color: #ff007f;">1.0X</span>
            </div>
            <div class="status-hud">
                <span id="shieldStatus">SHIELD: 0 🛡️</span>
                <span id="activePowerup" style="color: #ffb86c;">READY</span>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div class="mobile-controls">
            <button class="control-btn" aria-label="Move left" onclick="movePlayer(-1)">‹ LEFT</button>
            <button class="control-btn" aria-label="Move right" onclick="movePlayer(1)">RIGHT ›</button>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="screen">
            <h1>CYBER TAXI</h1>
            <p>SURVIVE THE NIGHT • BEAT YOUR SCORE</p>
            <button class="btn" onclick="startGame()">START RUN</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen hidden">
            <h1 style="color: #ff3333; text-shadow: 0 0 15px rgba(255,51,51,0.7);">GAME OVER</h1>
            <p id="finalScoreText" style="color: #8b949e;">FINAL SCORE: 0</p>
            <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight - document.querySelector('.mobile-controls').offsetHeight;
        }

        const container = document.getElementById("game-container");
        resizeCanvas();

        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;
        let bgmInterval = null;
        let screenShakeTimer = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startEngineSound();
            startBGM();
        }

        function startEngineSound() {
            if (engineOsc) return;
            try {
                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();
                
                engineOsc.type = "sawtooth";
                engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
                
                let filter = audioCtx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.setValueAtTime(150, audioCtx.currentTime);

                engineGain.gain.setValueAtTime(0.015, audioCtx.currentTime);

                engineOsc.connect(filter);
                filter.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                
                engineOsc.start();
            } catch (e) {
                console.log(e);
            }
        }

        function stopEngineSound() {
            if (engineOsc) {
                try {
                    engineOsc.stop();
                    engineOsc.disconnect();
                } catch(e) {}
                engineOsc = null;
            }
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function startBGM() {
            if (bgmInterval) return;
            const notes = [110, 130.81, 146.83, 164.81, 196, 220];
            let step = 0;
            
            bgmInterval = setInterval(() => {
                if (!isPlaying || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                    step++;
                } catch(e) {}
            }, 250);
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === "move") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.exponentialRampToValueAtTime(480, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === "powerup") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(950, now + 0.15);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === "shield_break") {
                    screenShakeTimer = 15; // Efek getar layar
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === "gameover") {
                    screenShakeTimer = 30; // Efek getar layar kuat
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.linearRampToValueAtTime(25, now + 0.6);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {
                console.log(e);
            }
        }

        let isPlaying = false;
        let score = 0;
        let gameSpeed = 4;
        let roadOffset = 0;
        
        const getLanes = () => [canvas.width / 2 - 75, canvas.width / 2, canvas.width / 2 + 75];
        let playerLane = 1;

        let player = {
            width: 44,
            height: 84,
            y: 0,
            shields: 0
        };

        let obstacles = [];
        let powerups = [];
        let particles = [];
        let activePowerupName = "READY";
        let powerupTimer = 0;
        let turboActive = false;
        let spawnTimer = 0;

        function movePlayer(direction) {
            if (!isPlaying) return;
            let lanes = getLanes();
            let newLane = playerLane + direction;
            if (newLane >= 0 && newLane < lanes.length) {
                playerLane = newLane;
                playSound("move");
                createParticles(lanes[playerLane], player.y + 42, "#00ffcc", 6);
            }
        }

        window.addEventListener("keydown", (e) => {
            if (!isPlaying) return;
            if (e.key === "ArrowLeft" || e.key === "a") movePlayer(-1);
            if (e.key === "ArrowRight" || e.key === "d") movePlayer(1);
        });

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function startGame() {
            initAudio();
            resizeCanvas();
            player.y = canvas.height - 110;

            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("gameOverScreen").classList.add("hidden");
            
            score = 0;
            gameSpeed = 4.5;
            playerLane = 1;
            obstacles = [];
            powerups = [];
            particles = [];
            player.shields = 0;
            turboActive = false;
            activePowerupName = "READY";
            powerupTimer = 0;
            spawnTimer = 0;
            isPlaying = true;
            
            loop();
        }

        function gameOver() {
            isPlaying = false;
            stopEngineSound();
            playSound("gameover");
            let lanes = getLanes();
            createParticles(lanes[playerLane], player.y, "#ff007f", 25);
            document.getElementById("finalScoreText").innerText = `FINAL SCORE: ${Math.floor(score)}`;
            document.getElementById("gameOverScreen").classList.remove("hidden");
        }

        function spawnEntity() {
            spawnTimer++;
            let lanes = getLanes();
            
            if (spawnTimer % Math.max(22, 45 - Math.floor(score / 150)) === 0) {
                let availableLanes = [0, 1, 2];
                let chosenLane = availableLanes[Math.floor(Math.random() * availableLanes.length)];
                
                obstacles.push({
                    lane: chosenLane,
                    y: -90,
                    width: 44,
                    height: 84
                });
            }

            if (spawnTimer % 160 === 0) {
                let obstacleLanes = obstacles.filter(o => o.y < 50).map(o => o.lane);
                let safeLanes = [0, 1, 2].filter(l => !obstacleLanes.includes(l));
                
                if (safeLanes.length > 0) {
                    let chosenLane = safeLanes[Math.floor(Math.random() * safeLanes.length)];
                    let types = ["shield", "turbo"];
                    let chosenType = types[Math.floor(Math.random() * types.length)];
                    
                    powerups.push({
                        lane: chosenLane,
                        y: -50,
                        size: 34,
                        type: chosenType
                    });
                }
            }
        }

        function update() {
            gameSpeed = 4.5 + (score / 200);
            let currentSpeed = turboActive ? gameSpeed * 1.8 : gameSpeed;

            roadOffset += currentSpeed;
            if (roadOffset > 40) roadOffset = 0;

            score += turboActive ? 0.8 : 0.3;

            if (powerupTimer > 0) {
                powerupTimer--;
                if (powerupTimer <= 0) {
                    turboActive = false;
                    activePowerupName = "NORMAL";
                }
            }

            spawnEntity();
            let lanes = getLanes();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += currentSpeed;
                if (
                    obstacles[i].lane === playerLane &&
                    obstacles[i].y < player.y + player.height &&
                    obstacles[i].y + obstacles[i].height > player.y
                ) {
                    if (player.shields > 0) {
                        player.shields--;
                        playSound("shield_break");
                        createParticles(lanes[playerLane], player.y, "#00ffcc", 18);
                        obstacles.splice(i, 1);
                    } else {
                        gameOver();
                        return;
                    }
                } else if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                powerups[i].y += currentSpeed;
                if (
                    powerups[i].lane === playerLane &&
                    powerups[i].y < player.y + player.height &&
                    powerups[i].y + powerups[i].size > player.y
                ) {
                    playSound("powerup");
                    createParticles(lanes[playerLane], powerups[i].y, "#ffb86c", 15);

                    if (powerups[i].type === "shield") {
                        player.shields++;
                        activePowerupName = `SHIELD +1`;
                    } else if (powerups[i].type === "turbo") {
                        turboActive = true;
                        activePowerupName = "TURBO BOOST!";
                        powerupTimer = 180;
                    }
                    powerups.splice(i, 1);
                } else if (powerups[i].y > canvas.height) {
                    powerups.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.05;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // Vector car renderer: no external assets.
        function drawRealisticCar(x, y, w, h, primaryColor, isPlayer) {
            ctx.save();
            const cx = x - w / 2;

            // soft ground shadow
            ctx.fillStyle = "rgba(0,0,0,.42)";
            ctx.beginPath();
            ctx.ellipse(x, y + h - 2, w * .62, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // neon underglow
            ctx.globalAlpha = .18;
            ctx.fillStyle = isPlayer ? "#5cf5d2" : "#ff477e";
            ctx.fillRect(cx - 2, y + h - 5, w + 4, 7);
            ctx.globalAlpha = 1;

            // wheels
            ctx.fillStyle = "#05070c";
            [[cx-5,y+19],[cx+w-1,y+19],[cx-5,y+h-31],[cx+w-1,y+h-31]].forEach(([wx,wy])=>{
                ctx.fillRect(wx, wy, 7, 19);
                ctx.fillStyle="#64748b";
                ctx.fillRect(wx+2, wy+4, 3, 10);
                ctx.fillStyle="#05070c";
            });

            // body
            ctx.fillStyle = primaryColor;
            ctx.beginPath();
            ctx.moveTo(cx+8,y+3);
            ctx.lineTo(cx+w-8,y+3);
            ctx.quadraticCurveTo(cx+w-2,y+10,cx+w-1,y+25);
            ctx.lineTo(cx+w-4,y+h-7);
            ctx.quadraticCurveTo(cx+w/2,y+h+1,cx+4,y+h-7);
            ctx.lineTo(cx+1,y+25);
            ctx.quadraticCurveTo(cx+2,y+10,cx+8,y+3);
            ctx.closePath();
            ctx.fill();

            // edge
            ctx.strokeStyle = isPlayer ? "#dffff9" : "#ff7b9e";
            ctx.lineWidth = 1.4; ctx.stroke();

            // cabin
            ctx.fillStyle = "#07111a";
            ctx.beginPath();
            ctx.moveTo(cx+7,y+24); ctx.lineTo(cx+w-7,y+24);
            ctx.lineTo(cx+w-10,y+52); ctx.lineTo(cx+10,y+52); ctx.closePath(); ctx.fill();

            // windshield split
            ctx.strokeStyle="rgba(176,226,235,.34)"; ctx.lineWidth=1;
            ctx.beginPath(); ctx.moveTo(x,y+25); ctx.lineTo(x,y+51); ctx.stroke();

            // hood / rear accent
            ctx.fillStyle = isPlayer ? "#36cdb6" : "#c92d5e";
            ctx.fillRect(cx+7,y+7,w-14,7);
            ctx.fillStyle = "rgba(255,255,255,.16)";
            ctx.fillRect(cx+8,y+17,w-16,2);

            if (isPlayer) {
                // headlights
                ctx.fillStyle="#f5ffcf";
                ctx.fillRect(cx+3,y+2,7,5); ctx.fillRect(cx+w-10,y+2,7,5);

                // taxi roof sign
                ctx.fillStyle="#f4fbff"; ctx.fillRect(cx+12,y+55,w-24,9);
                ctx.fillStyle="#07111a";
                ctx.font="700 7px Rajdhani, sans-serif"; ctx.textAlign="center";
                ctx.fillText("TAXI",x,y+62);
            } else {
                ctx.fillStyle="#ff3e61";
                ctx.fillRect(cx+3,y+h-6,8,4); ctx.fillRect(cx+w-11,y+h-6,8,4);
            }
            ctx.restore();
        }

        function draw() {
            ctx.save();

            if (screenShakeTimer > 0) {
                ctx.translate((Math.random()-.5)*7, (Math.random()-.5)*7);
                screenShakeTimer--;
            }

            ctx.clearRect(0,0,canvas.width,canvas.height);

            const W = canvas.width, H = canvas.height;
            const horizon = Math.max(105, H * .22);

            // Night sky / city atmosphere
            const sky = ctx.createLinearGradient(0,0,0,horizon);
            sky.addColorStop(0,"#050812"); sky.addColorStop(1,"#101b27");
            ctx.fillStyle=sky; ctx.fillRect(0,0,W,horizon);

            // distant skyline made from rectangles
            ctx.fillStyle="#0a111b";
            for(let i=0;i<16;i++){
                const bw=16+(i*13)%25, bh=20+(i*29)%65;
                const bx=i*29-10;
                ctx.fillRect(bx,horizon-bh,bw,bh);
                ctx.fillStyle="rgba(115,190,186,.10)";
                for(let wy=horizon-bh+9;wy<horizon-5;wy+=13) {
                    if(((i+Math.floor(wy/13))%3)===0) ctx.fillRect(bx+5,wy,3,5);
                }
                ctx.fillStyle="#0a111b";
            }

            // moon glow
            const moon = ctx.createRadialGradient(W*.78,horizon*.35,3,W*.78,horizon*.35,42);
            moon.addColorStop(0,"rgba(210,240,232,.18)");
            moon.addColorStop(1,"rgba(210,240,232,0)");
            ctx.fillStyle=moon; ctx.fillRect(0,0,W,horizon);

            // road body
            ctx.fillStyle="#090e16";
            ctx.fillRect(0,horizon,W,H-horizon);

            // road perspective shoulders
            ctx.fillStyle="#131c28";
            ctx.beginPath(); ctx.moveTo(0,horizon); ctx.lineTo(W*.18,horizon); ctx.lineTo(W*.08,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(W,horizon); ctx.lineTo(W*.82,horizon); ctx.lineTo(W*.92,H); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();

            // subtle road center gradient
            const roadGrad=ctx.createLinearGradient(0,horizon,0,H);
            roadGrad.addColorStop(0,"rgba(32,52,68,.16)");
            roadGrad.addColorStop(1,"rgba(0,0,0,.08)");
            ctx.fillStyle=roadGrad; ctx.fillRect(W*.12,horizon,W*.76,H-horizon);

            // lane dividers
            const lanes=getLanes();
            ctx.strokeStyle="rgba(120,155,166,.35)";
            ctx.lineWidth=2; ctx.setLineDash([26,30]); ctx.lineDashOffset=-roadOffset;
            ctx.beginPath();
            ctx.moveTo((lanes[0]+lanes[1])/2,horizon);
            ctx.lineTo((lanes[0]+lanes[1])/2,H);
            ctx.moveTo((lanes[1]+lanes[2])/2,horizon);
            ctx.lineTo((lanes[1]+lanes[2])/2,H);
            ctx.stroke(); ctx.setLineDash([]);

            // glowing road edge lines
            ctx.strokeStyle="rgba(92,245,210,.55)"; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(W*.12,horizon); ctx.lineTo(W*.08,H); ctx.moveTo(W*.88,horizon); ctx.lineTo(W*.92,H); ctx.stroke();

            // moving road streaks for speed
            ctx.globalAlpha=.22;
            ctx.strokeStyle="#8ab0bd"; ctx.lineWidth=1;
            for(let i=0;i<9;i++){
                const yy=horizon+((i*83+roadOffset*1.8)%(H-horizon));
                const t=(yy-horizon)/(H-horizon);
                const spread=20+t*45;
                ctx.beginPath(); ctx.moveTo(W*.5-spread,yy); ctx.lineTo(W*.5+spread,yy); ctx.stroke();
            }
            ctx.globalAlpha=1;

            // particles behind entities
            for (let p of particles) {
                ctx.save(); ctx.globalAlpha=p.alpha; ctx.fillStyle=p.color;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.radius,0,Math.PI*2); ctx.fill(); ctx.restore();
            }

            // player
            drawRealisticCar(lanes[playerLane],player.y,player.width,player.height,"#22d7bb",true);

            // shield ring
            if(player.shields>0){
                ctx.strokeStyle="rgba(92,245,210,.9)"; ctx.lineWidth=2;
                ctx.beginPath(); ctx.arc(lanes[playerLane],player.y+player.height/2,49+Math.sin(Date.now()/120)*2,0,Math.PI*2); ctx.stroke();
                ctx.strokeStyle="rgba(92,245,210,.18)"; ctx.lineWidth=7; ctx.stroke();
            }

            for(let obs of obstacles)
                drawRealisticCar(lanes[obs.lane],obs.y,obs.width,obs.height,"#d93663",false);

            // powerups: diamond badge instead of flat circle
            for(let p of powerups){
                const px=lanes[p.lane], py=p.y+p.size/2;
                const col=p.type==="shield"?"#5cf5d2":"#ffbd69";
                ctx.save();
                ctx.translate(px,py); ctx.rotate(Math.PI/4);
                ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(-17,-17,34,34);
                ctx.fillStyle=col; ctx.fillRect(-12,-12,24,24);
                ctx.restore();
                ctx.fillStyle="#071019"; ctx.font="700 16px Rajdhani,sans-serif";
                ctx.textAlign="center"; ctx.textBaseline="middle";
                ctx.fillText(p.type==="shield"?"S":"T",px,py);
            }

            // subtle scanlines + vignette
            ctx.fillStyle="rgba(255,255,255,.018)";
            for(let sy=0;sy<H;sy+=5) ctx.fillRect(0,sy,W,1);

            const vignette=ctx.createRadialGradient(W/2,H*.55,Math.min(W,H)*.2,W/2,H*.55,Math.max(W,H)*.72);
            vignette.addColorStop(0,"rgba(0,0,0,0)");
            vignette.addColorStop(1,"rgba(0,0,0,.42)");
            ctx.fillStyle=vignette; ctx.fillRect(0,0,W,H);

            ctx.restore();

            document.getElementById("scoreDisplay").innerText=`SCORE: ${Math.floor(score).toString().padStart(4,"0")}`;
            document.getElementById("speedDisplay").innerText=`${gameSpeed.toFixed(1)}X`;
            document.getElementById("shieldStatus").innerText=`SHIELD: ${player.shields} 🛡️`;
            document.getElementById("activePowerup").innerText=activePowerupName;
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
