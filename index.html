<script>
/* =========================================================
   CYBER TAXI — PART 2
   GAMEPLAY + RENDER ENGINE
   ========================================================= */


/* =========================================================
   WORLD CONFIGURATION
   ========================================================= */

const WORLD = {

    roadWidthRatio: 0.62,

    shoulderWidth: 18,

    laneSpacing: 75,

    horizonRatio: 0.18,

    roadGlow: "#00ffcc",

    cityColors: [
        "#00ffcc",
        "#ff007f",
        "#58a6ff",
        "#ffb86c"
    ]

};


/* =========================================================
   UTILITY
   ========================================================= */

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


function lerp(a, b, t) {

    return a + (b - a) * t;

}


function random(min, max) {

    return (
        Math.random() *
        (max - min) +
        min
    );

}


/* =========================================================
   WORLD INITIALIZATION
   ========================================================= */

function initializeWorld() {

    createCityLights();

    createStars();

}


initializeWorld();


/* =========================================================
   GAME UPDATE
   ========================================================= */

function update(delta) {

    if (
        !isPlaying ||
        isPaused ||
        isCountingDown
    ) {
        return;
    }


    /*
     * Delta is normalized around 60 FPS.
     */

    const dt =
        clamp(
            delta / 16.6667,
            0.35,
            2.2
        );


    gameTime += delta;


    const currentSpeed =
        getCurrentSpeed();


    /* ---------------------------------------------------------
       ROAD
       --------------------------------------------------------- */

    roadOffset +=
        currentSpeed * dt;

    if (
        roadOffset > 80
    ) {
        roadOffset %= 80;
    }


    /* ---------------------------------------------------------
       SCORE
       --------------------------------------------------------- */

    const scoreMultiplier =
        Math.max(
            1,
            1 +
            combo * 0.08
        );

    score +=
        0.34 *
        dt *
        scoreMultiplier;


    /* ---------------------------------------------------------
       COMBO TIMER
       --------------------------------------------------------- */

    if (
        comboTimer > 0
    ) {

        comboTimer -= dt;

        if (
            comboTimer <= 0
        ) {

            resetCombo();

        }
    }


    /* ---------------------------------------------------------
       TURBO TIMER
       --------------------------------------------------------- */

    if (
        powerupTimer > 0
    ) {

        powerupTimer -= dt;

        if (
            powerupTimer <= 0
        ) {

            powerupTimer = 0;

            turboActive = false;

            activePowerupName =
                "SYSTEM READY";

            showFeedback(
                "TURBO OFF",
                "#8b949e"
            );
        }
    }


    /* ---------------------------------------------------------
       PLAYER ANIMATION
       --------------------------------------------------------- */

    player.tilt =
        lerp(
            player.tilt,
            player.targetTilt,
            0.13 * dt
        );

    player.targetTilt =
        lerp(
            player.targetTilt,
            0,
            0.06 * dt
        );

    if (
        player.laneChangeFlash > 0
    ) {

        player.laneChangeFlash -= dt;

    }


    /* ---------------------------------------------------------
       ENGINE AUDIO
       --------------------------------------------------------- */

    updateEngineSound();


    /* ---------------------------------------------------------
       SPAWN
       --------------------------------------------------------- */

    spawnEntity(delta);


    /* ---------------------------------------------------------
       UPDATE TRAFFIC
       --------------------------------------------------------- */

    updateObstacles(
        currentSpeed,
        dt
    );


    if (!isPlaying) {
        return;
    }


    /* ---------------------------------------------------------
       UPDATE POWERUPS
       --------------------------------------------------------- */

    updatePowerups(
        currentSpeed,
        dt
    );


    /* ---------------------------------------------------------
       UPDATE PARTICLES
       --------------------------------------------------------- */

    updateParticles(dt);


    /* ---------------------------------------------------------
       UPDATE CITY
       --------------------------------------------------------- */

    updateCity(dt);


    /* ---------------------------------------------------------
       UPDATE FLOATING TEXT
       --------------------------------------------------------- */

    updateFloatingTexts(dt);


    /* ---------------------------------------------------------
       SCREEN EFFECTS
       --------------------------------------------------------- */

    if (
        screenShakeTimer > 0
    ) {

        screenShakeTimer -= dt;

    }

    if (
        flashTimer > 0
    ) {

        flashTimer -= dt;

    }


    /* ---------------------------------------------------------
       HUD
       --------------------------------------------------------- */

    updateHUD();
}


/* =========================================================
   OBSTACLE UPDATE
   ========================================================= */

function updateObstacles(
    currentSpeed,
    dt
) {

    const lanes =
        getLanes();

    const playerRect =
        getPlayerRect();


    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const obstacle =
            obstacles[i];


        obstacle.y +=
            (
                currentSpeed +
                obstacle.speedOffset
            ) *
            dt;


        /* -----------------------------------------------------
           COLLISION
           ----------------------------------------------------- */

        const obstacleRect =
            getObstacleRect(
                obstacle
            );


        if (
            intersects(
                playerRect,
                obstacleRect
            )
        ) {

            /*
             * Shield absorbs collision.
             */

            if (
                player.shields > 0
            ) {

                player.shields--;

                obstacle.hit = true;

                playSound(
                    "shield_break"
                );

                createParticles(
                    lanes[playerLane],
                    player.y +
                    player.height / 2,
                    "#00ffcc",
                    24,
                    {
                        speed: 5,
                        gravity: 0.03
                    }
                );

                addFloatingText(
                    "SHIELD BLOCK",
                    lanes[playerLane],
                    player.y - 8,
                    "#00ffcc"
                );

                showFeedback(
                    "SHIELD BLOCK",
                    "#00ffcc"
                );

                flashColor =
                    "#00ffcc";

                flashTimer = 8;

                resetCombo();

                obstacles.splice(
                    i,
                    1
                );

                continue;

            }


            /*
             * No shield = game over.
             */

            gameOver();

            return;

        }


        /* -----------------------------------------------------
           NEAR MISS
           ----------------------------------------------------- */

        if (
            !obstacle.nearMissChecked &&
            obstacle.lane !== playerLane
        ) {

            const verticalDistance =
                Math.abs(
                    (
                        obstacle.y +
                        obstacle.height / 2
                    ) -
                    (
                        player.y +
                        player.height / 2
                    )
                );


            if (
                verticalDistance < 52 &&
                verticalDistance > 12
            ) {

                /*
                 * Only count if horizontally
                 * close enough to feel risky.
                 */

                const obstacleLaneX =
                    lanes[
                        obstacle.lane
                    ];

                const playerLaneX =
                    lanes[
                        playerLane
                    ];

                const horizontalDistance =
                    Math.abs(
                        obstacleLaneX -
                        playerLaneX
                    );


                if (
                    horizontalDistance <
                    WORLD.laneSpacing * 1.05
                ) {

                    obstacle.nearMissChecked =
                        true;

                    registerNearMiss(
                        obstacleLaneX,
                        obstacle.y
                    );

                }

            }

        }


        /* -----------------------------------------------------
           PASSED
           ----------------------------------------------------- */

        if (
            !obstacle.passed &&
            obstacle.y >
            player.y +
            player.height
        ) {

            obstacle.passed = true;

            /*
             * Base score reward.
             */

            const reward =
                4 +
                Math.min(
                    combo,
                    10
                );

            score += reward;

            addFloatingText(
                `+${reward}`,
                lanes[
                    obstacle.lane
                ],
                player.y - 8,
                "#00ffcc"
            );

        }


        /* -----------------------------------------------------
           REMOVE
           ----------------------------------------------------- */

        if (
            obstacle.y >
            canvas.logicalHeight + 120
        ) {

            obstacles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   NEAR MISS
   ========================================================= */

function registerNearMiss(
    x,
    y
) {

    increaseCombo();

    const bonus =
        15 +
        Math.min(
            combo * 3,
            60
        );

    score += bonus;


    playSound(
        "nearMiss"
    );


    showFeedback(
        "NEAR MISS!",
        "#ffb86c"
    );


    addFloatingText(
        `+${bonus}`,
        x,
        y,
        "#ffb86c"
    );


    createParticles(
        x,
        y,
        "#ffb86c",
        10,
        {
            speed: 2.5
        }
    );

}


/* =========================================================
   POWERUP UPDATE
   ========================================================= */

function updatePowerups(
    currentSpeed,
    dt
) {

    const lanes =
        getLanes();

    const playerRect =
        getPlayerRect();


    for (
        let i = powerups.length - 1;
        i >= 0;
        i--
    ) {

        const powerup =
            powerups[i];


        powerup.y +=
            currentSpeed *
            dt;


        powerup.rotation +=
            0.025 *
            dt;


        powerup.pulse +=
            0.08 *
            dt;


        /* -----------------------------------------------------
           COLLISION
           ----------------------------------------------------- */

        const px =
            lanes[
                powerup.lane
            ];

        const py =
            powerup.y +
            powerup.size / 2;


        const powerupRect = {

            x:
                px -
                powerup.size / 2,

            y:
                powerup.y,

            width:
                powerup.size,

            height:
                powerup.size

        };


        if (
            powerup.lane ===
            playerLane &&
            intersects(
                playerRect,
                powerupRect
            )
        ) {

            collectPowerup(
                powerup
            );

            powerups.splice(
                i,
                1
            );

            continue;

        }


        /* -----------------------------------------------------
           REMOVE
           ----------------------------------------------------- */

        if (
            powerup.y >
            canvas.logicalHeight + 80
        ) {

            powerups.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   COLLECT POWERUP
   ========================================================= */

function collectPowerup(
    powerup
) {

    const lanes =
        getLanes();

    const x =
        lanes[
            powerup.lane
        ];

    const y =
        powerup.y +
        powerup.size / 2;


    playSound(
        "powerup"
    );


    createParticles(
        x,
        y,
        powerup.type === "shield"
            ? "#00ffcc"
            : "#ffb86c",
        22,
        {
            speed: 4,
            gravity: 0
        }
    );


    flashColor =
        powerup.type === "shield"
            ? "#00ffcc"
            : "#ffb86c";

    flashTimer =
        8;


    if (
        powerup.type ===
        "shield"
    ) {

        player.shields =
            Math.min(
                player.shields + 1,
                3
            );

        activePowerupName =
            "SHIELD +1";

        score += 30;

        addFloatingText(
            "+30 SHIELD",
            x,
            y,
            "#00ffcc"
        );

        showFeedback(
            "SHIELD ONLINE",
            "#00ffcc"
        );

    }


    else if (
        powerup.type ===
        "turbo"
    ) {

        turboActive =
            true;

        powerupTimer =
            240;

        activePowerupName =
            "TURBO BOOST";

        score += 50;

        addFloatingText(
            "+50 TURBO",
            x,
            y,
            "#ffb86c"
        );

        showFeedback(
            "TURBO BOOST!",
            "#ffb86c"
        );

    }

}


/* =========================================================
   PARTICLE UPDATE
   ========================================================= */

function updateParticles(dt) {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const particle =
            particles[i];


        particle.x +=
            particle.vx *
            dt;

        particle.y +=
            particle.vy *
            dt;


        particle.vy +=
            particle.gravity *
            dt;


        particle.alpha -=
            particle.decay *
            dt;


        particle.radius *=
            0.992;


        if (
            particle.alpha <= 0 ||
            particle.radius <
            0.2
        ) {

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   CITY UPDATE
   ========================================================= */

function updateCity(dt) {

    const height =
        canvas.logicalHeight ||
        700;


    for (
        const light of cityLights
    ) {

        light.y +=
            getCurrentSpeed() *
            0.35 *
            light.speed *
            dt;


        if (
            light.y >
            height + 30
        ) {

            light.y =
                -30;

            light.x =
                Math.random() <
                0.5
                    ? Math.random() *
                      (
                          canvas.logicalWidth *
                          0.18
                      )
                    : canvas.logicalWidth -
                      Math.random() *
                      (
                          canvas.logicalWidth *
                          0.18
                      );

        }

    }


    for (
        const star of stars
    ) {

        star.y +=
            getCurrentSpeed() *
            0.04 *
            star.speed *
            dt;


        if (
            star.y >
            height
        ) {

            star.y = -2;

        }

    }

}


/* =========================================================
   FLOATING TEXT UPDATE
   ========================================================= */

function updateFloatingTexts(
    dt
) {

    for (
        let i =
            floatingTexts.length - 1;
        i >= 0;
        i--
    ) {

        const text =
            floatingTexts[i];


        text.y +=
            text.velocityY *
            dt;


        text.alpha -=
            0.018 *
            dt;


        text.scale =
            lerp(
                text.scale,
                1,
                0.15
            );


        if (
            text.alpha <= 0
        ) {

            floatingTexts.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   HUD UPDATE
   ========================================================= */

function updateHUD() {

    scoreDisplay.textContent =
        Math.floor(score)
            .toString()
            .padStart(4, "0");


    const speed =
        getCurrentSpeed();


    speedDisplay.textContent =
        `${speed.toFixed(1)}X`;


    /*
     * Color shifts as speed rises.
     */

    if (
        turboActive
    ) {

        speedDisplay.style.color =
            "#ffb86c";

        speedDisplay.style.textShadow =
            "0 0 12px rgba(255,184,108,.8)";

    }

    else {

        speedDisplay.style.color =
            "#ff007f";

        speedDisplay.style.textShadow =
            "0 0 8px rgba(255,0,127,.5)";

    }


    shieldStatus.textContent =
        `SHIELD: ${player.shields}`;


    if (
        turboActive
    ) {

        const seconds =
            Math.ceil(
                powerupTimer /
                60
            );

        activePowerup.textContent =
            `TURBO ${seconds}s`;

    }

    else {

        activePowerup.textContent =
            activePowerupName;

    }


    if (
        combo > 1
    ) {

        comboHud.textContent =
            `COMBO x${combo}`;

        comboHud.classList.add(
            "visible"
        );

    }

    else {

        comboHud.classList.remove(
            "visible"
        );

    }

}


/* =========================================================
   MAIN DRAW
   ========================================================= */

function draw() {

    const width =
        canvas.logicalWidth ||
        container.clientWidth;

    const height =
        canvas.logicalHeight ||
        container.clientHeight;


    ctx.save();


    /* ---------------------------------------------------------
       SCREEN SHAKE
       --------------------------------------------------------- */

    if (
        screenShakeTimer > 0
    ) {

        const strength =
            screenShakeTimer > 20
                ? 7
                : 4;

        ctx.translate(
            random(
                -strength,
                strength
            ),
            random(
                -strength,
                strength
            )
        );

    }


    /* ---------------------------------------------------------
       CLEAR
       --------------------------------------------------------- */

    ctx.fillStyle =
        "#05070a";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* ---------------------------------------------------------
       SKY
       --------------------------------------------------------- */

    drawSky(
        width,
        height
    );


    /* ---------------------------------------------------------
       STARS
       --------------------------------------------------------- */

    drawStars();


    /* ---------------------------------------------------------
       CITY
       --------------------------------------------------------- */

    drawCity(
        width,
        height
    );


    /* ---------------------------------------------------------
       ROAD
       --------------------------------------------------------- */

    drawRoad(
        width,
        height
    );


    /* ---------------------------------------------------------
       ROAD DETAILS
       --------------------------------------------------------- */

    drawRoadDetails(
        width,
        height
    );


    /* ---------------------------------------------------------
       POWERUPS BEHIND VEHICLES
       --------------------------------------------------------- */

    for (
        const powerup of powerups
    ) {

        drawPowerup(
            powerup
        );

    }


    /* ---------------------------------------------------------
       OBSTACLES
       --------------------------------------------------------- */

    for (
        const obstacle of obstacles
    ) {

        drawTrafficCar(
            obstacle
        );

    }


    /* ---------------------------------------------------------
       PLAYER
       --------------------------------------------------------- */

    drawPlayerCar();


    /* ---------------------------------------------------------
       PARTICLES
       --------------------------------------------------------- */

    drawParticles();


    /* ---------------------------------------------------------
       FLOATING TEXT
       --------------------------------------------------------- */

    drawFloatingTexts();


    /* ---------------------------------------------------------
       ROAD GLOW
       --------------------------------------------------------- */

    drawSpeedGlow(
        width,
        height
    );


    /* ---------------------------------------------------------
       FLASH
       --------------------------------------------------------- */

    if (
        flashTimer > 0
    ) {

        ctx.fillStyle =
            hexToRgba(
                flashColor,
                Math.min(
                    flashTimer /
                    20,
                    0.16
                )
            );

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

    }


    ctx.restore();

}


/* =========================================================
   SKY
   ========================================================= */

function drawSky(
    width,
    height
) {

    const horizon =
        height *
        WORLD.horizonRatio;


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            horizon * 2.5
        );


    gradient.addColorStop(
        0,
        "#020307"
    );

    gradient.addColorStop(
        0.55,
        "#080b12"
    );

    gradient.addColorStop(
        1,
        "#151021"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
     * Neon horizon glow.
     */

    const glow =
        ctx.createRadialGradient(
            width / 2,
            horizon,
            0,
            width / 2,
            horizon,
            width * 0.55
        );


    glow.addColorStop(
        0,
        "rgba(255,0,127,.13)"
    );

    glow.addColorStop(
        0.4,
        "rgba(0,255,204,.035)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        width,
        horizon * 2
    );

}


/* =========================================================
   STARS
   ========================================================= */

function drawStars() {

    for (
        const star of stars
    ) {

        ctx.globalAlpha =
            star.alpha;

        ctx.fillStyle =
            "#b8ffff";

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   CITY
   ========================================================= */

function drawCity(
    width,
    height
) {

    const horizon =
        height *
        WORLD.horizonRatio;


    /*
     * Far skyline.
     */

    const farBuildings = [
        {
            x: 0,
            width: width * 0.12,
            height: 80
        },
        {
            x: width * 0.11,
            width: width * 0.08,
            height: 125
        },
        {
            x: width * 0.18,
            width: width * 0.11,
            height: 95
        },
        {
            x: width * 0.29,
            width: width * 0.07,
            height: 145
        },
        {
            x: width * 0.36,
            width: width * 0.12,
            height: 100
        },
        {
            x: width * 0.51,
            width: width * 0.1,
            height: 130
        },
        {
            x: width * 0.61,
            width: width * 0.08,
            height: 90
        },
        {
            x: width * 0.69,
            width: width * 0.13,
            height: 145
        },
        {
            x: width * 0.82,
            width: width * 0.09,
            height: 110
        },
        {
            x: width * 0.9,
            width: width * 0.12,
            height: 80
        }
    ];


    for (
        const building of farBuildings
    ) {

        const y =
            horizon -
            building.height;


        ctx.fillStyle =
            "#080b12";

        ctx.fillRect(
            building.x,
            y,
            building.width,
            building.height
        );


        /*
         * Building roof line.
         */

        ctx.strokeStyle =
            "rgba(0,255,204,.08)";

        ctx.lineWidth = 1;

        ctx.strokeRect(
            building.x,
            y,
            building.width,
            building.height
        );


        /*
         * Windows.
         */

        const columns =
            Math.max(
                1,
                Math.floor(
                    building.width / 8
                )
            );

        const rows =
            Math.max(
                2,
                Math.floor(
                    building.height / 13
                )
            );


        for (
            let cx = 0;
            cx < columns;
            cx++
        ) {

            for (
                let cy = 0;
                cy < rows;
                cy++
            ) {

                if (
                    Math.random() >
                    0.46
                ) {
                    continue;
                }


                const color =
                    Math.random() <
                    0.55
                        ? "rgba(0,255,204,.35)"
                        : "rgba(255,0,127,.3)";


                ctx.fillStyle =
                    color;


                ctx.fillRect(
                    building.x +
                    3 +
                    cx * 8,

                    y +
                    5 +
                    cy * 13,

                    2,

                    4
                );

            }

        }

    }


    /*
     * Foreground city lights.
     */

    for (
        const light of cityLights
    ) {

        ctx.globalAlpha =
            light.alpha;

        ctx.fillStyle =
            light.color;

        ctx.fillRect(
            light.x,
            light.y,
            light.width,
            light.height
        );

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   ROAD
   ========================================================= */

function drawRoad(
    width,
    height
) {

    const horizon =
        height *
        WORLD.horizonRatio;


    const center =
        width / 2;


    const roadBottomWidth =
        width *
        WORLD.roadWidthRatio;


    const roadTopWidth =
        Math.max(
            70,
            width * 0.16
        );


    const roadLeftTop =
        center -
        roadTopWidth / 2;

    const roadRightTop =
        center +
        roadTopWidth / 2;

    const roadLeftBottom =
        center -
        roadBottomWidth / 2;

    const roadRightBottom =
        center +
        roadBottomWidth / 2;


    /*
     * Road shadow.
     */

    ctx.beginPath();

    ctx.moveTo(
        roadLeftTop - 8,
        horizon
    );

    ctx.lineTo(
        roadRightTop + 8,
        horizon
    );

    ctx.lineTo(
        roadRightBottom + 10,
        height
    );

    ctx.lineTo(
        roadLeftBottom - 10,
        height
    );

    ctx.closePath();


    ctx.fillStyle =
        "rgba(0,0,0,.55)";

    ctx.fill();


    /*
     * Main road.
     */

    const roadGradient =
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            height
        );


    roadGradient.addColorStop(
        0,
        "#151923"
    );

    roadGradient.addColorStop(
        0.45,
        "#0d1117"
    );

    roadGradient.addColorStop(
        1,
        "#090c11"
    );


    ctx.beginPath();

    ctx.moveTo(
        roadLeftTop,
        horizon
    );

    ctx.lineTo(
        roadRightTop,
        horizon
    );

    ctx.lineTo(
        roadRightBottom,
        height
    );

    ctx.lineTo(
        roadLeftBottom,
        height
    );

    ctx.closePath();


    ctx.fillStyle =
        roadGradient;

    ctx.fill();


    /*
     * Neon outer road lines.
     */

    ctx.strokeStyle =
        "rgba(0,255,204,.45)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        roadLeftTop,
        horizon
    );

    ctx.lineTo(
        roadLeftBottom,
        height
    );

    ctx.moveTo(
        roadRightTop,
        horizon
    );

    ctx.lineTo(
        roadRightBottom,
        height
    );

    ctx.stroke();


    /*
     * Outer glow.
     */

    ctx.strokeStyle =
        "rgba(0,255,204,.08)";

    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(
        roadLeftTop,
        horizon
    );

    ctx.lineTo(
        roadLeftBottom,
        height
    );

    ctx.moveTo(
        roadRightTop,
        horizon
    );

    ctx.lineTo(
        roadRightBottom,
        height
    );

    ctx.stroke();

}


/* =========================================================
   ROAD DETAILS
   ========================================================= */

function drawRoadDetails(
    width,
    height
) {

    const center =
        width / 2;


    const horizon =
        height *
        WORLD.horizonRatio;


    const roadBottomWidth =
        width *
        WORLD.roadWidthRatio;


    const roadTopWidth =
        Math.max(
            70,
            width * 0.16
        );


    const leftTop =
        center -
        roadTopWidth / 2;

    const rightTop =
        center +
        roadTopWidth / 2;


    const leftBottom =
        center -
        roadBottomWidth / 2;

    const rightBottom =
        center +
        roadBottomWidth / 2;


    /*
     * Perspective lane separators.
     */

    const lanePositions = [
        1 / 3,
        2 / 3
    ];


    for (
        const ratio of lanePositions
    ) {

        const topX =
            lerp(
                leftTop,
                rightTop,
                ratio
            );

        const bottomX =
            lerp(
                leftBottom,
                rightBottom,
                ratio
            );


        drawPerspectiveDashedLine(
            topX,
            horizon,
            bottomX,
            height,
            24,
            24,
            roadOffset
        );

    }


    /*
     * Road texture.
     */

    drawRoadTexture(
        width,
        height
    );


    /*
     * Neon side markers.
     */

    drawSideMarkers(
        leftTop,
        rightTop,
        leftBottom,
        rightBottom,
        horizon,
        height
    );

}


/* =========================================================
   PERSPECTIVE DASHED LINE
   ========================================================= */

function drawPerspectiveDashedLine(
    x1,
    y1,
    x2,
    y2,
    dash,
    gap,
    offset
) {

    const total =
        Math.sqrt(
            Math.pow(
                x2 - x1,
                2
            ) +
            Math.pow(
                y2 - y1,
                2
            )
        );


    const ux =
        (x2 - x1) /
        total;

    const uy =
        (y2 - y1) /
        total;


    let distance =
        -(
            offset %
            (dash + gap)
        );


    while (
        distance <
        total
    ) {

        const start =
            Math.max(
                0,
                distance
            );

        const end =
            Math.min(
                total,
                distance + dash
            );


        if (
            end > 0 &&
            start < total
        ) {

            ctx.beginPath();

            ctx.moveTo(
                x1 +
                ux * start,
                y1 +
                uy * start
            );

            ctx.lineTo(
                x1 +
                ux * end,
                y1 +
                uy * end
            );


            ctx.strokeStyle =
                "rgba(0,255,204,.55)";

            ctx.lineWidth = 2;

            ctx.stroke();

        }


        distance +=
            dash + gap;

    }

}


/* =========================================================
   ROAD TEXTURE
   ========================================================= */

function drawRoadTexture(
    width,
    height
) {

    const seed =
        Math.floor(
            gameTime / 100
        );


    for (
        let i = 0;
        i < 14;
        i++
    ) {

        const y =
            (
                i * 73 +
                seed * 0.4
            ) %
            height;


        const x =
            width * 0.19 +
            (
                i * 43
            ) %
            (
                width * 0.62
            );


        ctx.fillStyle =
            "rgba(255,255,255,.018)";


        ctx.fillRect(
            x,
            y,
            2,
            12
        );

    }

}


/* =========================================================
   SIDE MARKERS
   ========================================================= */

function drawSideMarkers(
    leftTop,
    rightTop,
    leftBottom,
    rightBottom,
    horizon,
    height
) {

    const spacing = 48;


    for (
        let y = horizon;
        y < height;
        y += spacing
    ) {

        const progress =
            (
                y - horizon
            ) /
            (
                height - horizon
            );


        const leftX =
            lerp(
                leftTop,
                leftBottom,
                progress
            );

        const rightX =
            lerp(
                rightTop,
                rightBottom,
                progress
            );


        const size =
            2 +
            progress * 4;


        ctx.fillStyle =
            "rgba(255,0,127,.65)";


        ctx.shadowColor =
            "rgba(255,0,127,.8)";

        ctx.shadowBlur =
            7;


        ctx.fillRect(
            leftX - size / 2,
            y,
            size,
            size
        );


        ctx.fillRect(
            rightX - size / 2,
            y,
            size,
            size
        );


        ctx.shadowBlur = 0;

    }

}


/* =========================================================
   PLAYER CAR
   ========================================================= */

function drawPlayerCar() {

    const lanes =
        getLanes();


    const x =
        lanes[playerLane];


    ctx.save();


    /*
     * Slight movement tilt.
     */

    ctx.translate(
        x,
        player.y +
        player.height / 2
    );


    ctx.rotate(
        player.tilt
    );


    ctx.translate(
        -x,
        -(
            player.y +
            player.height / 2
        )
    );


    /*
     * Turbo exhaust.
     */

    if (
        turboActive
    ) {

        drawTurboExhaust(
            x,
            player.y +
            player.height -
            2
        );

    }


    /*
     * Lane change glow.
     */

    if (
        player.laneChangeFlash >
        0
    ) {

        ctx.fillStyle =
            hexToRgba(
                "#00ffcc",
                player.laneChangeFlash /
                35
            );

        ctx.beginPath();

        ctx.ellipse(
            x,
            player.y +
            player.height -
            5,
            29,
            9,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    drawRealisticCar(
        x,
        player.y,
        player.width,
        player.height,
        "#00ffcc",
        true
    );


    /*
     * Shield aura.
     */

    if (
        player.shields > 0
    ) {

        drawShieldAura(
            x,
            player.y +
            player.height / 2
        );

    }


    ctx.restore();

}


/* =========================================================
   TRAFFIC CAR
   ========================================================= */

function drawTrafficCar(
    obstacle
) {

    const lanes =
        getLanes();


    const x =
        lanes[
            obstacle.lane
        ];


    ctx.save();


    /*
     * Traffic gets a subtle visual offset.
     */

    const bounce =
        Math.sin(
            gameTime * 0.01 +
            obstacle.lane
        ) *
        0.45;


    drawRealisticCar(
        x,
        obstacle.y +
        bounce,
        obstacle.width,
        obstacle.height,
        obstacle.color,
        false
    );


    /*
     * Tail light glow.
     */

    ctx.fillStyle =
        "rgba(255,20,60,.08)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        obstacle.y +
        obstacle.height,
        24,
        9,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   REALISTIC CAR
   ========================================================= */

function drawRealisticCar(
    x,
    y,
    w,
    h,
    primaryColor,
    isPlayer
) {

    ctx.save();


    const cx =
        x -
        w / 2;


    /*
     * Ground shadow.
     */

    ctx.fillStyle =
        "rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y +
        h -
        2,
        w * 0.65,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * Neon underglow.
     */

    ctx.shadowColor =
        isPlayer
            ? "rgba(0,255,204,.5)"
            : "rgba(255,0,100,.28)";

    ctx.shadowBlur =
        isPlayer
            ? 14
            : 8;


    ctx.fillStyle =
        isPlayer
            ? "rgba(0,255,204,.10)"
            : "rgba(255,0,100,.07)";


    ctx.fillRect(
        cx + 3,
        y + h - 10,
        w - 6,
        8
    );


    ctx.shadowBlur = 0;


    /*
     * Tires.
     */

    drawWheel(
        cx - 3,
        y + 25,
        5,
        22
    );

    drawWheel(
        cx + w - 2,
        y + 25,
        5,
        22
    );

    drawWheel(
        cx - 3,
        y + h - 30,
        5,
        22
    );

    drawWheel(
        cx + w - 2,
        y + h - 30,
        5,
        22
    );


    /*
     * Main body.
     */

    const bodyGradient =
        ctx.createLinearGradient(
            cx,
            y,
            cx + w,
            y + h
        );


    if (
        isPlayer
    ) {

        bodyGradient.addColorStop(
            0,
            "#7affeb"
        );

        bodyGradient.addColorStop(
            0.18,
            "#00ffcc"
        );

        bodyGradient.addColorStop(
            0.55,
            "#00b38f"
        );

        bodyGradient.addColorStop(
            1,
            "#007d69"
        );

    }

    else {

        bodyGradient.addColorStop(
            0,
            "#ff5a9f"
        );

        bodyGradient.addColorStop(
            0.2,
            primaryColor
        );

        bodyGradient.addColorStop(
            0.65,
            "#a9004d"
        );

        bodyGradient.addColorStop(
            1,
            "#62002e"
        );

    }


    ctx.fillStyle =
        bodyGradient;


    ctx.beginPath();

    ctx.moveTo(
        cx + 8,
        y + 2
    );

    ctx.lineTo(
        cx + w - 8,
        y + 2
    );

    ctx.quadraticCurveTo(
        cx + w - 2,
        y + 10,
        cx + w,
        y + 27
    );

    ctx.lineTo(
        cx + w - 3,
        y + h - 9
    );

    ctx.quadraticCurveTo(
        cx + w / 2,
        y + h + 2,
        cx + 3,
        y + h - 9
    );

    ctx.lineTo(
        cx,
        y + 27
    );

    ctx.quadraticCurveTo(
        cx + 2,
        y + 10,
        cx + 8,
        y + 2
    );

    ctx.closePath();

    ctx.fill();


    /*
     * Body outline.
     */

    ctx.strokeStyle =
        isPlayer
            ? "rgba(255,255,255,.8)"
            : "rgba(255,90,160,.85)";

    ctx.lineWidth =
        isPlayer
            ? 1.4
            : 1.1;

    ctx.stroke();


    /*
     * Hood highlight.
     */

    ctx.fillStyle =
        isPlayer
            ? "rgba(255,255,255,.12)"
            : "rgba(255,255,255,.08)";


    ctx.beginPath();

    ctx.moveTo(
        cx + 9,
        y + 7
    );

    ctx.lineTo(
        cx + w - 9,
        y + 7
    );

    ctx.lineTo(
        cx + w - 12,
        y + 16
    );

    ctx.lineTo(
        cx + 12,
        y + 16
    );

    ctx.closePath();

    ctx.fill();


    /*
     * Windshield.
     */

    const glassGradient =
        ctx.createLinearGradient(
            cx,
            y + 20,
            cx,
            y + 45
        );


    glassGradient.addColorStop(
        0,
        "#0b1620"
    );

    glassGradient.addColorStop(
        0.45,
        "#071017"
    );

    glassGradient.addColorStop(
        1,
        "#020406"
    );


    ctx.fillStyle =
        glassGradient;


    ctx.beginPath();

    ctx.moveTo(
        cx + 6,
        y + 22
    );

    ctx.lineTo(
        cx + w - 6,
        y + 22
    );

    ctx.lineTo(
        cx + w - 4,
        y + 43
    );

    ctx.lineTo(
        cx + 4,
        y + 43
    );

    ctx.closePath();

    ctx.fill();


    /*
     * Windshield reflection.
     */

    ctx.strokeStyle =
        "rgba(88,166,255,.25)";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(
        cx + 9,
        y + 24
    );

    ctx.lineTo(
        cx + w - 13,
        y + 24
    );

    ctx.stroke();


    /*
     * Cabin roof.
     */

    ctx.fillStyle =
        primaryColor;


    ctx.fillRect(
        cx + 5,
        y + 44,
        w - 10,
        20
    );


    ctx.strokeStyle =
        isPlayer
            ? "rgba(255,255,255,.7)"
            : "rgba(255,90,160,.7)";

    ctx.strokeRect(
        cx + 5,
        y + 44,
        w - 10,
        20
    );


    /*
     * Side windows.
     */

    ctx.fillStyle =
        "#04070b";


    ctx.fillRect(
        cx + 7,
        y + 47,
        8,
        14
    );

    ctx.fillRect(
        cx + w - 15,
        y + 47,
        8,
        14
    );


    /*
     * Rear glass.
     */

    ctx.fillStyle =
        "#030508";


    ctx.fillRect(
        cx + 6,
        y + 66,
        w - 12,
        8
    );


    /*
     * Center body line.
     */

    ctx.strokeStyle =
        isPlayer
            ? "rgba(255,255,255,.22)"
            : "rgba(255,255,255,.14)";

    ctx.beginPath();

    ctx.moveTo(
        cx + 4,
        y + 64
    );

    ctx.lineTo(
        cx + w - 4,
        y + 64
    );

    ctx.stroke();


    /*
     * Player taxi roof sign.
     */

    if (
        isPlayer
    ) {

        drawTaxiSign(
            x,
            y + 50
        );

    }


    /*
     * Player headlights.
     */

    if (
        isPlayer
    ) {

        drawHeadlight(
            cx + 5,
            y + 1
        );

        drawHeadlight(
            cx + w - 12,
            y + 1
        );

    }

    else {

        /*
         * Traffic headlights.
         */

        ctx.fillStyle =
            "#fff9d1";

        ctx.fillRect(
            cx + 3,
            y + 1,
            6,
            4
        );

        ctx.fillRect(
            cx + w - 9,
            y + 1,
            6,
            4
        );


        /*
         * Rear red lights.
         */

        ctx.fillStyle =
            "#ff193f";

        ctx.fillRect(
            cx + 2,
            y + h - 6,
            8,
            5
        );

        ctx.fillRect(
            cx + w - 10,
            y + h - 6,
            8,
            5
        );

    }


    ctx.restore();

}

}

/* =========================================================
   TURBO EXHAUST
   ========================================================= */

function drawTurboExhaust(
    x,
    y
) {

    const pulse =
        0.65 +
        Math.sin(
            gameTime * 0.035
        ) * 0.2;


    ctx.save();


    /*
     * Main glow.
     */

    ctx.globalAlpha =
        pulse;


    const glow =
        ctx.createRadialGradient(
            x,
            y + 3,
            0,
            x,
            y + 8,
            34
        );


    glow.addColorStop(
        0,
        "rgba(255,255,180,.95)"
    );

    glow.addColorStop(
        0.18,
        "rgba(255,184,108,.85)"
    );

    glow.addColorStop(
        0.5,
        "rgba(255,80,40,.35)"
    );

    glow.addColorStop(
        1,
        "rgba(255,0,100,0)"
    );


    ctx.fillStyle =
        glow;


    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 5,
        22,
        18,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * Exhaust core.
     */

    ctx.fillStyle =
        "#fff6c7";

    ctx.beginPath();

    ctx.moveTo(
        x - 7,
        y
    );

    ctx.lineTo(
        x + 7,
        y
    );

    ctx.lineTo(
        x + 3,
        y + 24 +
        Math.random() * 7
    );

    ctx.lineTo(
        x,
        y + 18
    );

    ctx.lineTo(
        x - 4,
        y + 25 +
        Math.random() * 5
    );

    ctx.closePath();

    ctx.fill();


    /*
     * Secondary exhaust streaks.
     */

    ctx.strokeStyle =
        "rgba(255,184,108,.7)";

    ctx.lineWidth = 2;

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const offset =
            (i - 1) * 5;

        ctx.beginPath();

        ctx.moveTo(
            x + offset,
            y + 5
        );

        ctx.lineTo(
            x +
            offset * 1.4,
            y +
            17 +
            Math.random() * 10
        );

        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   SHIELD AURA
   ========================================================= */

function drawShieldAura(
    x,
    y
) {

    const pulse =
        1 +
        Math.sin(
            gameTime * 0.012
        ) * 0.08;


    const radius =
        34 *
        pulse;


    ctx.save();


    /*
     * Outer energy field.
     */

    ctx.strokeStyle =
        "rgba(0,255,204,.28)";

    ctx.lineWidth = 2;

    ctx.shadowColor =
        "#00ffcc";

    ctx.shadowBlur =
        14;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /*
     * Inner energy field.
     */

    ctx.shadowBlur = 0;

    ctx.strokeStyle =
        "rgba(88,166,255,.16)";

    ctx.lineWidth = 1;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius - 5,
        gameTime * 0.002,
        gameTime * 0.002 +
        Math.PI * 1.55
    );

    ctx.stroke();


    /*
     * Energy particles around shield.
     */

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const angle =
            gameTime * 0.004 +
            i *
            Math.PI *
            2 /
            5;


        const px =
            x +
            Math.cos(angle) *
            radius;

        const py =
            y +
            Math.sin(angle) *
            radius;


        ctx.fillStyle =
            "#00ffcc";

        ctx.shadowColor =
            "#00ffcc";

        ctx.shadowBlur =
            8;


        ctx.fillRect(
            px - 1.5,
            py - 1.5,
            3,
            3
        );

    }


    ctx.restore();

}


/* =========================================================
   POWERUP DRAW
   ========================================================= */

function drawPowerup(
    powerup
) {

    const lanes =
        getLanes();


    const x =
        lanes[
            powerup.lane
        ];

    const y =
        powerup.y +
        powerup.size / 2;


    const color =
        powerup.type === "shield"
            ? "#00ffcc"
            : "#ffb86c";


    const pulse =
        1 +
        Math.sin(
            powerup.pulse
        ) *
        0.08;


    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        powerup.rotation
    );

    ctx.scale(
        pulse,
        pulse
    );


    /*
     * Outer glow.
     */

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        18;


    ctx.strokeStyle =
        color;

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        powerup.size * 0.42,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    ctx.shadowBlur = 0;


    /*
     * Diamond frame.
     */

    ctx.fillStyle =
        "rgba(5,10,15,.88)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        -powerup.size * 0.38
    );

    ctx.lineTo(
        powerup.size * 0.38,
        0
    );

    ctx.lineTo(
        0,
        powerup.size * 0.38
    );

    ctx.lineTo(
        -powerup.size * 0.38,
        0
    );

    ctx.closePath();

    ctx.fill();


    ctx.strokeStyle =
        color;

    ctx.lineWidth = 1.5;

    ctx.stroke();


    /*
     * Icon.
     */

    if (
        powerup.type ===
        "shield"
    ) {

        drawShieldIcon(
            0,
            0,
            color
        );

    }

    else {

        drawTurboIcon(
            0,
            0,
            color
        );

    }


    ctx.restore();

}


/* =========================================================
   SHIELD ICON
   ========================================================= */

function drawShieldIcon(
    x,
    y,
    color
) {

    ctx.save();


    ctx.fillStyle =
        color;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        7;


    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 9
    );

    ctx.lineTo(
        x + 8,
        y - 5
    );

    ctx.lineTo(
        x + 6,
        y + 5
    );

    ctx.quadraticCurveTo(
        x,
        y + 11,
        x,
        y + 11
    );

    ctx.quadraticCurveTo(
        x,
        y + 11,
        x - 6,
        y + 5
    );

    ctx.lineTo(
        x - 8,
        y - 5
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#061015";

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 5
    );

    ctx.lineTo(
        x + 4,
        y - 3
    );

    ctx.lineTo(
        x + 3,
        y + 3
    );

    ctx.lineTo(
        x,
        y + 6
    );

    ctx.lineTo(
        x - 3,
        y + 3
    );

    ctx.lineTo(
        x - 4,
        y - 3
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   TURBO ICON
   ========================================================= */

function drawTurboIcon(
    x,
    y,
    color
) {

    ctx.save();


    ctx.fillStyle =
        color;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        8;


    ctx.beginPath();

    ctx.moveTo(
        x + 5,
        y - 11
    );

    ctx.lineTo(
        x - 2,
        y - 1
    );

    ctx.lineTo(
        x + 3,
        y - 1
    );

    ctx.lineTo(
        x - 5,
        y + 11
    );

    ctx.lineTo(
        x + 1,
        y + 1
    );

    ctx.lineTo(
        x - 4,
        y + 1
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   PARTICLE CREATION
   ========================================================= */

function createParticles(
    x,
    y,
    color,
    count = 12,
    options = {}
) {

    const speed =
        options.speed ??
        2.5;

    const gravity =
        options.gravity ??
        0.04;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const velocity =
            Math.random() *
            speed +
            0.5;


        particles.push({

            x:
                x +
                random(-4, 4),

            y:
                y +
                random(-4, 4),

            vx:
                Math.cos(angle) *
                velocity,

            vy:
                Math.sin(angle) *
                velocity,

            gravity,

            alpha:
                random(.65, 1),

            decay:
                random(.018, .045),

            radius:
                random(1, 3.2),

            color

        });

    }


    /*
     * Prevent runaway particle counts.
     */

    if (
        particles.length >
        500
    ) {

        particles.splice(
            0,
            particles.length -
            500
        );

    }

}


/* =========================================================
   PARTICLE DRAW
   ========================================================= */

function drawParticles() {

    ctx.save();


    for (
        const particle of particles
    ) {

        ctx.globalAlpha =
            particle.alpha;

        ctx.fillStyle =
            particle.color;

        ctx.shadowColor =
            particle.color;

        ctx.shadowBlur =
            particle.radius *
            4;


        ctx.beginPath();

        ctx.arc(
            particle.x,
            particle.y,
            particle.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.restore();

}


/* =========================================================
   FLOATING TEXT
   ========================================================= */

function addFloatingText(
    text,
    x,
    y,
    color = "#00ffcc"
) {

    floatingTexts.push({

        text,

        x,

        y,

        color,

        alpha: 1,

        scale: 1.25,

        velocityY: -0.7

    });


    if (
        floatingTexts.length >
        40
    ) {

        floatingTexts.shift();

    }

}


/* =========================================================
   FLOATING TEXT DRAW
   ========================================================= */

function drawFloatingTexts() {

    ctx.save();

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    for (
        const item of floatingTexts
    ) {

        ctx.globalAlpha =
            item.alpha;


        ctx.font =
            `800 ${
                12 *
                item.scale
            }px Orbitron, monospace`;


        ctx.fillStyle =
            item.color;

        ctx.shadowColor =
            item.color;

        ctx.shadowBlur =
            8;


        ctx.fillText(
            item.text,
            item.x,
            item.y
        );

    }


    ctx.restore();

}


/* =========================================================
   SPEED GLOW
   ========================================================= */

function drawSpeedGlow(
    width,
    height
) {

    const speed =
        getCurrentSpeed();


    const intensity =
        clamp(
            (
                speed -
                1
            ) /
            7,
            0,
            1
        );


    if (
        intensity <= 0
    ) {
        return;
    }


    ctx.save();


    /*
     * Side motion streaks.
     */

    ctx.globalAlpha =
        intensity *
        0.24;


    ctx.strokeStyle =
        turboActive
            ? "#ffb86c"
            : "#00ffcc";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const side =
            i % 2 === 0
                ? -1
                : 1;


        const y =
            random(
                canvas.logicalHeight *
                0.25,
                canvas.logicalHeight
            );


        const length =
            random(
                20,
                80
            );


        const center =
            canvas.logicalWidth /
            2;


        const startX =
            center +
            side *
            random(
                canvas.logicalWidth *
                0.32,
                canvas.logicalWidth *
                0.48
            );


        ctx.beginPath();

        ctx.moveTo(
            startX,
            y
        );

        ctx.lineTo(
            startX +
            side *
            length,
            y
        );

        ctx.stroke();

    }


    /*
     * Tunnel vignette.
     */

    const vignette =
        ctx.createRadialGradient(
            width / 2,
            height * 0.55,
            height * 0.18,
            width / 2,
            height * 0.55,
            width * 0.72
        );


    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        0.72,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        turboActive
            ? "rgba(255,120,40,.12)"
            : "rgba(0,255,204,.07)"
    );


    ctx.fillStyle =
        vignette;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.restore();

}


/* =========================================================
   CITY / STAR CREATION
   ========================================================= */

function createCityLights() {

    cityLights.length = 0;


    const width =
        canvas.logicalWidth ||
        canvas.width ||
        900;


    const height =
        canvas.logicalHeight ||
        canvas.height ||
        700;


    for (
        let i = 0;
        i < 55;
        i++
    ) {

        const side =
            Math.random() <
            0.5
                ? "left"
                : "right";


        const x =
            side === "left"
                ? Math.random() *
                  width *
                  0.22
                : width -
                  Math.random() *
                  width *
                  0.22;


        const y =
            Math.random() *
            height;


        cityLights.push({

            x,

            y,

            width:
                random(2, 6),

            height:
                random(2, 9),

            speed:
                random(.4, 1.2),

            alpha:
                random(.15, .6),

            color:
                WORLD.cityColors[
                    Math.floor(
                        Math.random() *
                        WORLD.cityColors.length
                    )
                ]

        });

    }

}


/* =========================================================
   STAR CREATION
   ========================================================= */

function createStars() {

    stars.length = 0;


    const width =
        canvas.logicalWidth ||
        canvas.width ||
        900;


    const height =
        canvas.logicalHeight ||
        canvas.height ||
        700;


    for (
        let i = 0;
        i < 75;
        i++
    ) {

        stars.push({

            x:
                Math.random() *
                width,

            y:
                Math.random() *
                height *
                0.42,

            size:
                random(.6, 1.8),

            alpha:
                random(.2, .85),

            speed:
                random(.3, 1.1)

        });

    }

}


/* =========================================================
   RESIZE
   ========================================================= */

function resizeCanvas() {

    const rect =
        container.getBoundingClientRect();


    const dpr =
        Math.min(
            window.devicePixelRatio ||
            1,
            2
        );


    const width =
        Math.max(
            320,
            Math.floor(
                rect.width
            )
        );


    const height =
        Math.max(
            480,
            Math.floor(
                rect.height
            )
        );


    /*
     * Logical resolution.
     */

    canvas.logicalWidth =
        width;

    canvas.logicalHeight =
        height;


    /*
     * Real pixel resolution.
     */

    canvas.width =
        Math.floor(
            width * dpr
        );

    canvas.height =
        Math.floor(
            height * dpr
        );


    canvas.style.width =
        `${width}px`;

    canvas.style.height =
        `${height}px`;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    /*
     * Rebuild environmental objects
     * after resize.
     */

    createCityLights();

    createStars();


    /*
     * Keep player aligned.
     */

    if (
        player
    ) {

        player.y =
            height -
            150;

    }

}


/* =========================================================
   VISIBILITY / FOCUS
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            if (
                isPlaying &&
                !isPaused
            ) {

                pauseGame(
                    "TAB HIDDEN"
                );

            }

        }

    }
);


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

    }
);


/* =========================================================
   KEYBOARD INPUT
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
         * Ignore key repeat for lane changes.
         */

        if (
            event.repeat
        ) {
            return;
        }


        if (
            event.key ===
            "ArrowLeft" ||
            event.key.toLowerCase() ===
            "a"
        ) {

            event.preventDefault();

            movePlayer(
                -1
            );

            return;

        }


        if (
            event.key ===
            "ArrowRight" ||
            event.key.toLowerCase() ===
            "d"
        ) {

            event.preventDefault();

            movePlayer(
                1
            );

            return;

        }


        /*
         * Pause.
         */

        if (
            event.key ===
            "Escape" ||
            event.key.toLowerCase() ===
            "p"
        ) {

            event.preventDefault();

            if (
                isPlaying
            ) {

                togglePause();

            }

            return;

        }


        /*
         * Quick restart.
         */

        if (
            event.key.toLowerCase() ===
            "r"
        ) {

            if (
                !isPlaying ||
                isPaused
            ) {

                restartGame();

            }

        }

    }
);


/* =========================================================
   POINTER / TOUCH INPUT
   ========================================================= */

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;


canvas.addEventListener(
    "pointerdown",
    event => {

        touchStartX =
            event.clientX;

        touchStartY =
            event.clientY;

        touchStartTime =
            performance.now();


        /*
         * Prevent browser gestures.
         */

        canvas.setPointerCapture(
            event.pointerId
        );

    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        const dx =
            event.clientX -
            touchStartX;

        const dy =
            event.clientY -
            touchStartY;

        const duration =
            performance.now() -
            touchStartTime;


        /*
         * Swipe threshold.
         */

        if (
            Math.abs(dx) >
            30 &&
            Math.abs(dx) >
            Math.abs(dy) *
            1.2 &&
            duration <
            700
        ) {

            movePlayer(
                dx > 0
                    ? 1
                    : -1
            );

        }


        canvas.releasePointerCapture(
            event.pointerId
        );

    }
);


/* =========================================================
   GAME LOOP
   ========================================================= */

let lastFrameTime =
    performance.now();


function gameLoop(
    timestamp
) {

    const delta =
        Math.min(
            timestamp -
            lastFrameTime,
            50
        );


    lastFrameTime =
        timestamp;


    update(
        delta
    );


    draw();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


/* =========================================================
   INITIAL SETUP
   ========================================================= */

resizeCanvas();


/*
 * Initial HUD state.
 */

if (
    typeof updateHUD ===
    "function"
) {

    updateHUD();

}


/* =========================================================
   FINAL POLISH OVERRIDES
   ========================================================= */

/*
 * The following helpers intentionally sit at the end of the
 * gameplay renderer so they can enhance the existing systems
 * without requiring the original architecture to be rewritten.
 */


/* =========================================================
   SCREEN VIGNETTE
   ========================================================= */

function drawFinalVignette(
    width,
    height
) {

    const gradient =
        ctx.createRadialGradient(
            width / 2,
            height * 0.48,
            height * 0.15,
            width / 2,
            height * 0.48,
            Math.max(
                width,
                height
            ) * 0.72
        );


    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
        0.68,
        "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.48)"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

}


/* =========================================================
   SCANLINE EFFECT
   ========================================================= */

function drawScanlines(
    width,
    height
) {

    /*
     * Very subtle CRT treatment.
     * Kept intentionally low opacity so gameplay remains clear.
     */

    ctx.save();

    ctx.globalAlpha =
        0.035;

    ctx.fillStyle =
        "#ffffff";


    for (
        let y = 0;
        y < height;
        y += 4
    ) {

        ctx.fillRect(
            0,
            y,
            width,
            1
        );

    }


    ctx.restore();

}


/* =========================================================
   COLOR GRADE
   ========================================================= */

function drawColorGrade(
    width,
    height
) {

    const turbo =
        turboActive;


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            width,
            height
        );


    gradient.addColorStop(
        0,
        turbo
            ? "rgba(255,100,40,.025)"
            : "rgba(0,255,204,.018)"
    );

    gradient.addColorStop(
        0.5,
        "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
        1,
        turbo
            ? "rgba(255,0,100,.035)"
            : "rgba(255,0,127,.025)"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

}


/* =========================================================
   ENHANCED DRAW PASS
   ========================================================= */

const originalDraw =
    draw;


draw =
    function enhancedDraw() {

        originalDraw();


        const width =
            canvas.logicalWidth ||
            container.clientWidth;


        const height =
            canvas.logicalHeight ||
            container.clientHeight;


        ctx.save();


        /*
         * Final cinematic pass.
         */

        drawColorGrade(
            width,
            height
        );


        drawFinalVignette(
            width,
            height
        );


        drawScanlines(
            width,
            height
        );


        /*
         * Critical hit / damage flash.
         */

        if (
            flashTimer > 0
        ) {

            ctx.globalAlpha =
                Math.min(
                    flashTimer /
                    30,
                    0.08
                );


            ctx.fillStyle =
                flashColor ||
                "#00ffcc";


            ctx.fillRect(
                0,
                0,
                width,
                height
            );

        }


        ctx.restore();

    };


/* =========================================================
   PERFORMANCE GUARD
   ========================================================= */

let performanceAccumulator = 0;
let performanceSamples = 0;
let performanceMode = "HIGH";


function updatePerformanceMode(
    delta
) {

    performanceAccumulator +=
        delta;

    performanceSamples++;


    /*
     * Evaluate roughly once per second.
     */

    if (
        performanceAccumulator <
        1000
    ) {

        return;

    }


    const average =
        performanceAccumulator /
        performanceSamples;


    performanceAccumulator = 0;
    performanceSamples = 0;


    if (
        average > 22
    ) {

        performanceMode =
            "LOW";

    }

    else if (
        average > 17
    ) {

        performanceMode =
            "MEDIUM";

    }

    else {

        performanceMode =
            "HIGH";

    }

}


/* =========================================================
   PERFORMANCE-AWARE PARTICLE LIMIT
   ========================================================= */

function getParticleLimit() {

    if (
        performanceMode ===
        "LOW"
    ) {

        return 180;

    }


    if (
        performanceMode ===
        "MEDIUM"
    ) {

        return 320;

    }


    return 500;

}


/* =========================================================
   PATCH PARTICLE CREATION
   ========================================================= */

const originalCreateParticles =
    createParticles;


createParticles =
    function optimizedCreateParticles(
        x,
        y,
        color,
        count = 12,
        options = {}
    ) {

        const limit =
            getParticleLimit();


        const available =
            Math.max(
                0,
                limit -
                particles.length
            );


        if (
            available <= 0
        ) {

            return;

        }


        originalCreateParticles(
            x,
            y,
            color,
            Math.min(
                count,
                available
            ),
            options
        );

    };


/* =========================================================
   PERFORMANCE MONITOR PATCH
   ========================================================= */

const originalUpdate =
    update;


update =
    function polishedUpdate(
        delta
    ) {

        updatePerformanceMode(
            delta
        );


        originalUpdate(
            delta
        );

    };


/* =========================================================
   SAFE INITIALIZATION
   ========================================================= */

try {

    resizeCanvas();

    createCityLights();

    createStars();

    updateHUD();

}

catch (
    error
) {

    console.warn(
        "CYBER TAXI initialization warning:",
        error
    );

}


/* =========================================================
   END OF CYBER TAXI
   ========================================================= */
</script>
