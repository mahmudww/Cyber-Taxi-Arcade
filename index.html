<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Lane Dodger Deluxe</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 750px;
            background: #1e293b;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #090d16;
            flex-grow: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        .header-hud {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .status-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px 10px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        /* Tombol Kontrol Layar Khusus Smartphone */
        .mobile-controls {
            display: flex;
            width: 100%;
            height: 100px;
            background: #0f172a;
            border-top: 2px solid #1e293b;
        }
        .control-btn {
            flex: 1;
            background: #1e293b;
            border: none;
            color: #38bdf8;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .control-btn:active {
            background: #334155;
            color: #7dd3fc;
        }
        .control-btn:first-child {
            border-right: 1px solid #334155;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        h1 {
            font-size: 30px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas Game -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Informasi Permainan -->
        <div class="ui-layer">
            <div class="header-hud">
                <span id="scoreDisplay">SCORE: 0</span>
                <span id="speedDisplay" style="color: #38bdf8;">1.0x</span>
            </div>
            <div class="status-hud">
                <span id="shieldStatus">SHIELD: ❌</span>
                <span id="activePowerup" style="color: #facc15;">-</span>
            </div>
        </div>

        <!-- Tombol Kontrol Lajur untuk Smartphone -->
        <div class="mobile-controls">
            <button class="control-btn" onclick="movePlayer(-1)">◀ KIRI</button>
            <button class="control-btn" onclick="movePlayer(1)">KANAN ▶</button>
        </div>

        <!-- Layar Mulai / Game Over -->
        <div id="startScreen" class="screen">
            <h1>NEON DODGER</h1>
            <p>Hindari rintangan, ambil Power-Up (Shield, Slow-Mo, Multiplier). Gunakan tombol di bawah atau keyboard (Panah Kiri/Kanan).</p>
            <button class="btn" onclick="startGame()">MAIN SEKARANG</button>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <h1>GAME OVER</h1>
            <p id="finalScoreText">Skor Akhir: 0</p>
            <button class="btn" onclick="startGame()">MAIN LAGI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const container = document.getElementById("game-container");
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight - 100; // Dikurangi tinggi tombol kontrol

        // Web Audio API untuk SFX tanpa file eksternal
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;

                if (type === "move") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === "powerup") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === "shield_break") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === "gameover") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.5);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {
                console.log(e);
            }
        }

        // Variabel Game
        let isPlaying = false;
        let score = 0;
        let gameSpeed = 4;
        let roadOffset = 0;
        
        const lanes = [canvas.width / 2 - 80, canvas.width / 2, canvas.width / 2 + 80];
        let playerLane = 1;

        let player = {
            width: 38,
            height: 65,
            y: canvas.height - 100,
            shieldActive: false
        };

        let obstacles = [];
        let powerups = [];
        let particles = []; // Untuk VFX Partikel
        let activePowerupName = "-";
        let powerupTimer = 0;
        let slowMoActive = false;
        let doubleScoreActive = false;
        let spawnTimer = 0;

        function movePlayer(direction) {
            if (!isPlaying) return;
            let newLane = playerLane + direction;
            if (newLane >= 0 && newLane < lanes.length) {
                playerLane = newLane;
                playSound("move");
                createParticles(lanes[playerLane], player.y + player.height / 2, "#38bdf8", 5);
            }
        }

        // Kontrol Keyboard (Laptop)
        window.addEventListener("keydown", (e) => {
            if (!isPlaying) return;
            if (e.key === "ArrowLeft" || e.key === "a") {
                movePlayer(-1);
            } else if (e.key === "ArrowRight" || e.key === "d") {
                movePlayer(1);
            }
        });

        // Sistem VFX Partikel
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function startGame() {
            initAudio();
            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("gameOverScreen").classList.add("hidden");
            
            score = 0;
            gameSpeed = 4;
            playerLane = 1;
            obstacles = [];
            powerups = [];
            particles = [];
            player.shieldActive = false;
            slowMoActive = false;
            doubleScoreActive = false;
            activePowerupName = "-";
            powerupTimer = 0;
            spawnTimer = 0;
            isPlaying = true;
            
            loop();
        }

        function gameOver() {
            isPlaying = false;
            playSound("gameover");
            createParticles(lanes[playerLane], player.y, "#f43f5e", 25);
            document.getElementById("finalScoreText").innerText = `Skor Akhir: ${Math.floor(score)}`;
            document.getElementById("gameOverScreen").classList.remove("hidden");
        }

        function spawnEntity() {
            spawnTimer++;
            if (spawnTimer % 45 === 0) {
                let randomLane = Math.floor(Math.random() * lanes.length);
                obstacles.push({
                    lane: randomLane,
                    y: -100,
                    width: 38,
                    height: 65,
                    color: "#f43f5e"
                });
            }
            if (spawnTimer % 180 === 0) {
                let randomLane = Math.floor(Math.random() * lanes.length);
                let types = ["shield", "slow", "double"];
                let chosenType = types[Math.floor(Math.random() * types.length)];
                powerups.push({
                    lane: randomLane,
                    y: -40,
                    size: 26,
                    type: chosenType
                });
            }
        }

        function update() {
            gameSpeed = 4 + (score / 400);
            let currentSpeed = slowMoActive ? gameSpeed * 0.5 : gameSpeed;

            roadOffset += currentSpeed;
            if (roadOffset > 40) roadOffset = 0;

            score += doubleScoreActive ? 0.4 : 0.2;

            if (powerupTimer > 0) {
                powerupTimer--;
                if (powerupTimer <= 0) {
                    slowMoActive = false;
                    doubleScoreActive = false;
                    activePowerupName = "-";
                }
            }

            spawnEntity();

            // Update rintangan
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += currentSpeed;
                
                if (
                    obstacles[i].lane === playerLane &&
                    obstacles[i].y < player.y + player.height &&
                    obstacles[i].y + obstacles[i].height > player.y
                ) {
                    if (player.shieldActive) {
                        player.shieldActive = false;
                        playSound("shield_break");
                        createParticles(lanes[playerLane], player.y, "#22c55e", 15);
                        obstacles.splice(i, 1);
                    } else {
                        gameOver();
                        return;
                    }
                } else if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            // Update power-up
            for (let i = powerups.length - 1; i >= 0; i--) {
                powerups[i].y += currentSpeed;

                if (
                    powerups[i].lane === playerLane &&
                    powerups[i].y < player.y + player.height &&
                    powerups[i].y + powerups[i].size > player.y
                ) {
                    playSound("powerup");
                    createParticles(lanes[playerLane], powerups[i].y, "#eab308", 12);

                    if (powerups[i].type === "shield") {
                        player.shieldActive = true;
                        activePowerupName = "SHIELD AKTIF";
                    } else if (powerups[i].type === "slow") {
                        slowMoActive = true;
                        activePowerupName = "SLOW-MO (0.5x)";
                        powerupTimer = 250;
                    } else if (powerups[i].type === "double") {
                        doubleScoreActive = true;
                        activePowerupName = "2X SCORE";
                        powerupTimer = 250;
                    }
                    powerups.splice(i, 1);
                } else if (powerups[i].y > canvas.height) {
                    powerups.splice(i, 1);
                }
            }

            // Update Partikel VFX
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gambar Garis Lajur Jalan
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;

            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 - 40, 0);
            ctx.lineTo(canvas.width / 2 - 40, canvas.height);
            ctx.moveTo(canvas.width / 2 + 40, 0);
            ctx.lineTo(canvas.width / 2 + 40, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Gambar Partikel VFX
            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Gambar Mobil Player
            let targetX = lanes[playerLane] - player.width / 2;
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(targetX, player.y, player.width, player.height);
            
            // Efek Shield
            if (player.shieldActive) {
                ctx.strokeStyle = "#22c55e";
                ctx.lineWidth = 3;
                ctx.strokeRect(targetX - 4, player.y - 4, player.width + 8, player.height + 8);
            }

            // Gambar Rintangan
            for (let obs of obstacles) {
                let obsX = lanes[obs.lane] - obs.width / 2;
                ctx.fillStyle = obs.color;
                ctx.fillRect(obsX, obs.y, obs.width, obs.height);
            }

            // Gambar Power-up
            for (let p of powerups) {
                let pX = lanes[p.lane] - p.size / 2;
                ctx.fillStyle = p.type === "shield" ? "#22c55e" : (p.type === "slow" ? "#a855f7" : "#eab308");
                ctx.fillRect(pX, p.y, p.size, p.size);
            }

            // Update HUD
            document.getElementById("scoreDisplay").innerText = `SCORE: ${Math.floor(score)}`;
            document.getElementById("speedDisplay").innerText = `${gameSpeed.toFixed(1)}x`;
            document.getElementById("shieldStatus").innerText = `SHIELD: ${player.shieldActive ? '🛡️' : '❌'}`;
            document.getElementById("activePowerup").innerText = activePowerupName;
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
