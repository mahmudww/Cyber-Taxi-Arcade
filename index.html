<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <meta name="theme-color" content="#030305">

    <title>CYBER TAXI // NIGHT SHIFT</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --cyan: #00ffcc;
            --cyan-soft: #00cfa8;
            --pink: #ff007f;
            --pink-hot: #ff1a75;
            --orange: #ffb86c;
            --red: #ff3333;
            --blue: #58a6ff;
            --white: #f5f7fa;
            --muted: #8b949e;
            --dark: #030305;
            --road: #0d1117;
            --panel: #090a0f;
            --line: #1f293d;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(0, 255, 204, 0.035),
                    transparent 60%
                ),
                #030305;
            font-family: "VT323", monospace;
            color: var(--cyan);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            font-family: inherit;
        }

        /* =========================================================
           GAME CONTAINER
           ========================================================= */

        #game-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 100vh;
            overflow: hidden;

            background: #090a0f;
            border: 2px solid #1f293d;

            box-shadow:
                0 0 20px rgba(0, 255, 204, 0.08),
                0 0 60px rgba(0, 0, 0, 0.8);

            display: flex;
            flex-direction: column;

            isolation: isolate;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #0d1117;
        }

        /* =========================================================
           HUD
           ========================================================= */

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            padding: 12px;

            display: flex;
            flex-direction: column;
            gap: 7px;

            pointer-events: none;
            z-index: 20;
        }

        .hud-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .hud-score {
            min-width: 0;
        }

        .score-label {
            color: rgba(0, 255, 204, 0.6);
            font-size: 14px;
            line-height: 1;
            letter-spacing: 2px;
        }

        #scoreDisplay {
            margin-top: 1px;

            color: var(--white);
            font-size: 30px;
            line-height: 0.95;
            letter-spacing: 2px;

            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.25),
                0 0 14px rgba(0, 255, 204, 0.35);
        }

        .speed-box {
            text-align: right;
        }

        .speed-label {
            color: rgba(255, 0, 127, 0.6);
            font-size: 14px;
            line-height: 1;
            letter-spacing: 2px;
        }

        #speedDisplay {
            color: var(--pink);
            font-size: 30px;
            line-height: 0.95;

            text-shadow:
                0 0 8px rgba(255, 0, 127, 0.5);
        }

        .status-hud {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;

            min-height: 35px;
            padding: 5px 9px;

            background: rgba(8, 12, 18, 0.82);
            border: 1px solid rgba(31, 41, 61, 0.95);
            border-radius: 4px;

            backdrop-filter: blur(4px);

            box-shadow:
                inset 0 0 15px rgba(0, 255, 204, 0.025),
                0 4px 20px rgba(0, 0, 0, 0.25);
        }

        #shieldStatus {
            color: var(--cyan);
            font-size: 19px;
            letter-spacing: 1px;
        }

        #activePowerup {
            color: var(--orange);
            font-size: 19px;
            letter-spacing: 1px;
            text-align: right;

            text-shadow:
                0 0 7px rgba(255, 184, 108, 0.35);
        }

        .combo-hud {
            align-self: center;

            min-width: 120px;
            padding: 3px 12px;

            text-align: center;

            color: #ffffff;
            background: rgba(255, 0, 127, 0.08);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 3px;

            font-size: 18px;
            letter-spacing: 2px;

            opacity: 0;
            transform: translateY(-8px) scale(0.9);

            transition:
                opacity 0.12s ease,
                transform 0.12s ease;
        }

        .combo-hud.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* =========================================================
           PAUSE BUTTON
           ========================================================= */

        #pauseButton {
            position: absolute;
            top: 12px;
            right: 12px;

            z-index: 30;

            width: 38px;
            height: 32px;

            display: none;
            align-items: center;
            justify-content: center;

            color: var(--cyan);
            background: rgba(3, 3, 5, 0.65);

            border: 1px solid rgba(0, 255, 204, 0.35);
            border-radius: 3px;

            font-size: 19px;

            pointer-events: auto;
            cursor: pointer;
        }

        #pauseButton.visible {
            display: flex;
        }

        #pauseButton:active {
            background: rgba(0, 255, 204, 0.15);
        }

        /* =========================================================
           MOBILE CONTROLS
           ========================================================= */

        .mobile-controls {
            position: relative;

            display: flex;
            width: 100%;
            height: 82px;

            flex-shrink: 0;

            background:
                linear-gradient(
                    180deg,
                    #07090d 0%,
                    #030305 100%
                );

            border-top: 2px solid #1f293d;

            z-index: 40;
        }

        .control-btn {
            position: relative;

            flex: 1;

            border: 0;
            border-radius: 0;

            color: var(--cyan);
            background: #0b1016;

            font-size: 27px;
            letter-spacing: 2px;

            cursor: pointer;

            transition:
                background 0.08s ease,
                color 0.08s ease,
                transform 0.08s ease;

            overflow: hidden;
        }

        .control-btn::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    transparent 0%,
                    rgba(0, 255, 204, 0.05) 50%,
                    transparent 100%
                );

            opacity: 0.8;
        }

        .control-btn:first-child {
            border-right: 2px solid #1f293d;
        }

        .control-btn:active {
            color: #ffffff;
            background: #14202a;
            transform: scale(0.985);

            box-shadow:
                inset 0 0 20px rgba(0, 255, 204, 0.12);
        }

        .control-hint {
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;

            color: rgba(139, 148, 158, 0.55);
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* =========================================================
           SCREENS
           ========================================================= */

        .screen {
            position: absolute;
            inset: 0;

            z-index: 100;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 25px;

            text-align: center;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(0, 255, 204, 0.055),
                    transparent 45%
                ),
                rgba(3, 3, 5, 0.965);

            backdrop-filter: blur(2px);
        }

        .screen.hidden {
            display: none !important;
        }

        /* =========================================================
           TITLE
           ========================================================= */

        .logo-small {
            margin-bottom: 5px;

            color: rgba(0, 255, 204, 0.7);

            font-size: 15px;
            letter-spacing: 5px;

            text-shadow:
                0 0 8px rgba(0, 255, 204, 0.4);
        }

        h1 {
            margin: 0;

            color: var(--pink);

            font-size: clamp(52px, 15vw, 68px);
            line-height: 0.9;

            letter-spacing: 4px;

            text-shadow:
                0 0 6px rgba(255, 0, 127, 0.8),
                0 0 25px rgba(255, 0, 127, 0.5);

            animation: logoPulse 2.4s ease-in-out infinite;
        }

        .title-divider {
            width: 160px;
            height: 2px;

            margin: 14px 0 15px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--cyan),
                transparent
            );

            box-shadow:
                0 0 10px rgba(0, 255, 204, 0.5);
        }

        .tagline {
            max-width: 310px;

            margin: 0 0 25px;

            color: var(--cyan);

            font-size: 20px;
            line-height: 1.15;
            letter-spacing: 1px;

            text-shadow:
                0 0 6px rgba(0, 255, 204, 0.35);
        }

        .game-info {
            display: flex;
            gap: 8px;

            margin-bottom: 23px;
        }

        .info-chip {
            padding: 5px 9px;

            color: var(--muted);

            border: 1px solid rgba(139, 148, 158, 0.2);
            background: rgba(139, 148, 158, 0.035);

            font-size: 15px;
            letter-spacing: 1px;
        }

        .info-chip span {
            color: var(--cyan);
        }

        /* =========================================================
           BUTTON
           ========================================================= */

        .btn {
            position: relative;

            min-width: 190px;

            padding: 11px 30px;

            color: #030305;
            background: var(--cyan);

            border: none;

            font-size: 27px;
            font-weight: bold;
            letter-spacing: 3px;

            cursor: pointer;

            box-shadow:
                0 0 10px rgba(0, 255, 204, 0.35),
                0 0 30px rgba(0, 255, 204, 0.12);

            transition:
                transform 0.08s ease,
                background 0.08s ease,
                box-shadow 0.08s ease;
        }

        .btn::after {
            content: "";

            position: absolute;
            inset: 3px;

            border: 1px solid rgba(3, 3, 5, 0.22);

            pointer-events: none;
        }

        .btn:hover {
            box-shadow:
                0 0 15px rgba(0, 255, 204, 0.6),
                0 0 35px rgba(0, 255, 204, 0.18);
        }

        .btn:active {
            transform: scale(0.96);
            color: #ffffff;
            background: #00cfa8;
        }

        .secondary-btn {
            margin-top: 12px;

            color: var(--muted);
            background: transparent;

            border: 1px solid rgba(139, 148, 158, 0.3);

            box-shadow: none;
        }

        .secondary-btn:hover {
            color: var(--cyan);
            border-color: rgba(0, 255, 204, 0.5);
            box-shadow: none;
        }

        /* =========================================================
           GAME OVER
           ========================================================= */

        .gameover-title {
            color: var(--red);

            text-shadow:
                0 0 8px rgba(255, 51, 51, 0.8),
                0 0 25px rgba(255, 51, 51, 0.35);

            animation: gameOverFlicker 1.2s steps(2, end) infinite;
        }

        .score-card {
            width: min(280px, 90%);

            margin: 22px 0;

            padding: 14px 20px;

            background: rgba(13, 17, 23, 0.8);

            border: 1px solid rgba(31, 41, 61, 0.9);

            box-shadow:
                inset 0 0 20px rgba(0, 255, 204, 0.025);
        }

        .final-score-label {
            color: var(--muted);

            font-size: 16px;
            letter-spacing: 2px;
        }

        #finalScoreText {
            margin: 3px 0 0;

            color: #ffffff;

            font-size: 38px;
            letter-spacing: 2px;

            text-shadow:
                0 0 12px rgba(0, 255, 204, 0.3);
        }

        #bestScoreText {
            margin-top: 3px;

            color: var(--orange);
            font-size: 17px;
            letter-spacing: 1px;
        }

        .new-record {
            color: var(--pink) !important;

            animation:
                recordPulse 0.7s ease-in-out infinite alternate;
        }

        /* =========================================================
           COUNTDOWN
           ========================================================= */

        #countdown {
            position: absolute;
            inset: 0;

            z-index: 90;

            display: none;

            align-items: center;
            justify-content: center;

            pointer-events: none;
        }

        #countdown.visible {
            display: flex;
        }

        #countdownText {
            color: #ffffff;

            font-size: 92px;
            line-height: 1;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.7),
                0 0 35px rgba(0, 255, 204, 0.55);
        }

        /* =========================================================
           PAUSE SCREEN
           ========================================================= */

        #pauseScreen {
            background: rgba(3, 3, 5, 0.88);
        }

        .pause-title {
            color: var(--cyan);

            font-size: 52px;
            letter-spacing: 4px;

            text-shadow:
                0 0 18px rgba(0, 255, 204, 0.45);
        }

        .pause-subtitle {
            margin: 8px 0 25px;

            color: var(--muted);
            font-size: 19px;
        }

        /* =========================================================
           TOAST / FEEDBACK
           ========================================================= */

        #feedbackContainer {
            position: absolute;
            left: 50%;
            top: 45%;

            z-index: 50;

            pointer-events: none;

            transform: translateX(-50%);
        }

        .feedback {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);

            white-space: nowrap;

            font-size: 25px;
            letter-spacing: 2px;

            text-shadow:
                0 0 8px currentColor;

            animation: feedbackFloat 0.75s ease-out forwards;
        }

        /* =========================================================
           CRT
           ========================================================= */

        #crtOverlay {
            position: absolute;
            inset: 0;

            z-index: 80;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.12) 0px,
                    rgba(0, 0, 0, 0.12) 1px,
                    transparent 1px,
                    transparent 4px
                );

            opacity: 0.5;
            mix-blend-mode: multiply;
        }

        #vignette {
            position: absolute;
            inset: 0;

            z-index: 81;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 55%,
                    rgba(0, 0, 0, 0.22) 100%
                );
        }

        /* =========================================================
           ANIMATIONS
           ========================================================= */

        @keyframes logoPulse {
            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.18);
            }
        }

        @keyframes gameOverFlicker {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.72;
            }
        }

        @keyframes recordPulse {
            from {
                text-shadow: 0 0 5px rgba(255, 0, 127, 0.3);
            }

            to {
                text-shadow:
                    0 0 8px rgba(255, 0, 127, 0.9),
                    0 0 22px rgba(255, 0, 127, 0.5);
            }
        }

        @keyframes feedbackFloat {
            0% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(10px)
                    scale(0.8);
            }

            20% {
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1.05);
            }

            100% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(-55px)
                    scale(1);
            }
        }

        /* =========================================================
           DESKTOP
           ========================================================= */

        @media (min-width: 700px) {
            #game-container {
                height: min(900px, 100vh);
                border-radius: 4px;
            }

            .mobile-controls {
                height: 72px;
            }
        }

        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

<body>

    <div id="game-container">

        <!-- =====================================================
             CANVAS
             ===================================================== -->

        <canvas id="gameCanvas"></canvas>


        <!-- =====================================================
             HUD
             ===================================================== -->

        <div class="ui-layer">

            <div class="hud-top">

                <div class="hud-score">
                    <div class="score-label">DISTANCE / SCORE</div>
                    <div id="scoreDisplay">0000</div>
                </div>

                <div class="speed-box">
                    <div class="speed-label">VELOCITY</div>
                    <div id="speedDisplay">1.0X</div>
                </div>

            </div>

            <div class="status-hud">
                <span id="shieldStatus">
                    SHIELD: 0
                </span>

                <span id="activePowerup">
                    SYSTEM READY
                </span>
            </div>

            <div id="comboHud" class="combo-hud">
                COMBO x1
            </div>

        </div>


        <!-- =====================================================
             PAUSE BUTTON
             ===================================================== -->

        <button
            id="pauseButton"
            aria-label="Pause game"
            onclick="togglePause()"
        >
            II
        </button>


        <!-- =====================================================
             MOBILE CONTROLS
             ===================================================== -->

        <div class="mobile-controls">

            <button
                class="control-btn"
                id="leftButton"
                onclick="movePlayer(-1)"
            >
                &lt; LEFT
                <span class="control-hint">A / ←</span>
            </button>

            <button
                class="control-btn"
                id="rightButton"
                onclick="movePlayer(1)"
            >
                RIGHT &gt;
                <span class="control-hint">D / →</span>
            </button>

        </div>


        <!-- =====================================================
             START SCREEN
             ===================================================== -->

        <div id="startScreen" class="screen">

            <div class="logo-small">
                NIGHT CITY // TAXI DIVISION
            </div>

            <h1>CYBER<br>TAXI</h1>

            <div class="title-divider"></div>

            <p class="tagline">
                Dodge the grid.<br>
                Own the neon night.
            </p>

            <div class="game-info">
                <div class="info-chip">
                    BEST:
                    <span id="startBestScore">0000</span>
                </div>

                <div class="info-chip">
                    SHIFT:
                    <span>01</span>
                </div>
            </div>

            <button
                class="btn"
                onclick="startGame()"
            >
                INSERT COIN
            </button>

        </div>


        <!-- =====================================================
             GAME OVER SCREEN
             ===================================================== -->

        <div id="gameOverScreen" class="screen hidden">

            <div class="logo-small">
                SHIFT TERMINATED
            </div>

            <h1 class="gameover-title">
                GAME<br>OVER
            </h1>

            <div class="score-card">

                <div class="final-score-label">
                    FINAL SCORE
                </div>

                <div id="finalScoreText">
                    0000
                </div>

                <div id="bestScoreText">
                    BEST: 0000
                </div>

            </div>

            <button
                class="btn"
                onclick="startGame()"
            >
                PLAY AGAIN
            </button>

            <button
                class="btn secondary-btn"
                onclick="returnToTitle()"
            >
                TITLE SCREEN
            </button>

        </div>


        <!-- =====================================================
             PAUSE SCREEN
             ===================================================== -->

        <div
            id="pauseScreen"
            class="screen hidden"
        >

            <div class="pause-title">
                PAUSED
            </div>

            <div class="pause-subtitle">
                Your passenger is waiting.
            </div>

            <button
                class="btn"
                onclick="togglePause()"
            >
                RESUME
            </button>

            <button
                class="btn secondary-btn"
                onclick="restartFromPause()"
            >
                RESTART SHIFT
            </button>

        </div>


        <!-- =====================================================
             COUNTDOWN
             ===================================================== -->

        <div id="countdown">
            <div id="countdownText">3</div>
        </div>


        <!-- =====================================================
             FEEDBACK
             ===================================================== -->

        <div id="feedbackContainer"></div>


        <!-- =====================================================
             CRT EFFECT
             ===================================================== -->

        <div id="crtOverlay"></div>
        <div id="vignette"></div>

    </div>


    <script>

        /* =========================================================
           DOM
           ========================================================= */

        const container =
            document.getElementById("game-container");

        const canvas =
            document.getElementById("gameCanvas");

        const ctx =
            canvas.getContext("2d", {
                alpha: false
            });

        const scoreDisplay =
            document.getElementById("scoreDisplay");

        const speedDisplay =
            document.getElementById("speedDisplay");

        const shieldStatus =
            document.getElementById("shieldStatus");

        const activePowerup =
            document.getElementById("activePowerup");

        const comboHud =
            document.getElementById("comboHud");

        const pauseButton =
            document.getElementById("pauseButton");

        const startScreen =
            document.getElementById("startScreen");

        const gameOverScreen =
            document.getElementById("gameOverScreen");

        const pauseScreen =
            document.getElementById("pauseScreen");

        const countdown =
            document.getElementById("countdown");

        const countdownText =
            document.getElementById("countdownText");

        const feedbackContainer =
            document.getElementById("feedbackContainer");

        const finalScoreText =
            document.getElementById("finalScoreText");

        const bestScoreText =
            document.getElementById("bestScoreText");

        const startBestScore =
            document.getElementById("startBestScore");


        /* =========================================================
           CANVAS / DISPLAY
           ========================================================= */

        let devicePixelRatio = 1;

        function resizeCanvas() {

            const controls =
                document.querySelector(".mobile-controls");

            const width =
                container.clientWidth;

            const height =
                container.clientHeight -
                controls.offsetHeight;

            devicePixelRatio =
                Math.min(window.devicePixelRatio || 1, 2);

            canvas.width =
                Math.floor(width * devicePixelRatio);

            canvas.height =
                Math.floor(height * devicePixelRatio);

            canvas.style.width =
                `${width}px`;

            canvas.style.height =
                `${height}px`;

            ctx.setTransform(
                devicePixelRatio,
                0,
                0,
                devicePixelRatio,
                0,
                0
            );

            canvas.logicalWidth = width;
            canvas.logicalHeight = height;

            if (player) {
                player.y =
                    height - 108;
            }
        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );

        window.addEventListener(
            "orientationchange",
            () => {
                setTimeout(
                    resizeCanvas,
                    150
                );
            }
        );


        /* =========================================================
           GAME STATE
           ========================================================= */

        let isPlaying = false;
        let isPaused = false;
        let isCountingDown = false;

        let score = 0;
        let bestScore =
            Number(
                localStorage.getItem(
                    "cyberTaxiBest"
                )
            ) || 0;

        let gameTime = 0;

        let roadOffset = 0;

        let playerLane = 1;

        let spawnTimer = 0;

        let powerupSpawnTimer = 0;

        let nearMissTimer = 0;

        let combo = 0;

        let comboTimer = 0;

        let screenShakeTimer = 0;

        let flashTimer = 0;

        let flashColor = "#ffffff";

        let lastFrameTime = 0;

        let animationFrame = null;


        /* =========================================================
           PLAYER
           ========================================================= */

        const player = {

            width: 44,

            height: 84,

            y: 0,

            shields: 0,

            tilt: 0,

            targetTilt: 0,

            laneChangeFlash: 0

        };


        /* =========================================================
           ENTITIES
           ========================================================= */

        let obstacles = [];

        let powerups = [];

        let particles = [];

        let floatingTexts = [];

        let cityLights = [];

        let stars = [];


        /* =========================================================
           POWERUP STATE
           ========================================================= */

        let activePowerupName =
            "SYSTEM READY";

        let powerupTimer = 0;

        let turboActive = false;


        /* =========================================================
           AUDIO
           ========================================================= */

        let audioCtx = null;

        let masterGain = null;

        let engineOsc = null;

        let engineGain = null;

        let engineFilter = null;

        let bgmInterval = null;

        let bgmStep = 0;

        let audioMuted =
            localStorage.getItem(
                "cyberTaxiMuted"
            ) === "true";


        /* =========================================================
           LANES
           ========================================================= */

        function getLanes() {

            const w =
                canvas.logicalWidth ||
                container.clientWidth;

            const center =
                w / 2;

            const spacing =
                Math.min(
                    75,
                    w * 0.19
                );

            return [
                center - spacing,
                center,
                center + spacing
            ];
        }


        /* =========================================================
           INITIALIZE WORLD
           ========================================================= */

        function createCityLights() {

            cityLights = [];

            const width =
                canvas.logicalWidth ||
                container.clientWidth;

            for (
                let i = 0;
                i < 42;
                i++
            ) {

                const side =
                    Math.random() < 0.5
                        ? "left"
                        : "right";

                const x =
                    side === "left"
                        ? Math.random() * width * 0.18
                        : width -
                          Math.random() * width * 0.18;

                cityLights.push({

                    x,

                    y:
                        Math.random() *
                        (canvas.logicalHeight || 700),

                    width:
                        Math.random() * 4 + 2,

                    height:
                        Math.random() * 12 + 6,

                    speed:
                        Math.random() * 0.6 + 0.5,

                    color:
                        Math.random() < 0.55
                            ? "#00ffcc"
                            : "#ff007f",

                    alpha:
                        Math.random() * 0.5 + 0.15

                });
            }
        }


        function createStars() {

            stars = [];

            const width =
                canvas.logicalWidth ||
                container.clientWidth;

            const height =
                canvas.logicalHeight ||
                700;

            for (
                let i = 0;
                i < 35;
                i++
            ) {

                stars.push({

                    x:
                        Math.random() * width,

                    y:
                        Math.random() * height,

                    size:
                        Math.random() * 1.5 + 0.3,

                    alpha:
                        Math.random() * 0.45 + 0.15,

                    speed:
                        Math.random() * 0.25 + 0.05

                });
            }
        }


        /* =========================================================
           AUDIO ENGINE
           ========================================================= */

        function initAudio() {

            if (!audioCtx) {

                audioCtx =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

                masterGain =
                    audioCtx.createGain();

                masterGain.gain.value =
                    audioMuted ? 0 : 0.65;

                masterGain.connect(
                    audioCtx.destination
                );
            }

            if (
                audioCtx.state ===
                "suspended"
            ) {
                audioCtx.resume();
            }

            startEngineSound();
            startBGM();
        }


        function startEngineSound() {

            if (
                engineOsc ||
                !audioCtx
            ) {
                return;
            }

            try {

                engineOsc =
                    audioCtx.createOscillator();

                engineGain =
                    audioCtx.createGain();

                engineFilter =
                    audioCtx.createBiquadFilter();

                engineOsc.type =
                    "sawtooth";

                engineOsc.frequency.value =
                    52;

                engineFilter.type =
                    "lowpass";

                engineFilter.frequency.value =
                    135;

                engineGain.gain.value =
                    0.018;

                engineOsc
                    .connect(engineFilter);

                engineFilter
                    .connect(engineGain);

                engineGain
                    .connect(masterGain);

                engineOsc.start();

            } catch (error) {

                console.warn(
                    "Audio engine error:",
                    error
                );
            }
        }


        function updateEngineSound() {

            if (
                !audioCtx ||
                !engineOsc ||
                !engineGain
            ) {
                return;
            }

            const velocity =
                getCurrentSpeed();

            const frequency =
                48 +
                velocity * 4;

            engineOsc.frequency.setTargetAtTime(
                frequency,
                audioCtx.currentTime,
                0.04
            );

            const volume =
                turboActive
                    ? 0.028
                    : 0.015;

            engineGain.gain.setTargetAtTime(
                volume,
                audioCtx.currentTime,
                0.06
            );

            if (engineFilter) {

                engineFilter.frequency.setTargetAtTime(
                    turboActive
                        ? 240
                        : 150,
                    audioCtx.currentTime,
                    0.08
                );
            }
        }


        function stopEngineSound() {

            if (engineOsc) {

                try {
                    engineOsc.stop();
                    engineOsc.disconnect();
                } catch (error) {}

                engineOsc = null;
            }

            if (engineGain) {

                try {
                    engineGain.disconnect();
                } catch (error) {}

                engineGain = null;
            }

            engineFilter = null;
        }


        function startBGM() {

            if (
                bgmInterval ||
                !audioCtx
            ) {
                return;
            }

            const notes = [

                110,
                130.81,
                146.83,
                164.81,
                196,
                164.81,
                146.83,
                130.81

            ];

            bgmInterval =
                setInterval(() => {

                    if (
                        !isPlaying ||
                        isPaused ||
                        !audioCtx
                    ) {
                        return;
                    }

                    playNote(
                        notes[
                            bgmStep %
                            notes.length
                        ],
                        0.16
                    );

                    bgmStep++;

                }, 260);
        }


        function stopBGM() {

            if (bgmInterval) {

                clearInterval(
                    bgmInterval
                );

                bgmInterval = null;
            }
        }


        function playNote(
            frequency,
            duration = 0.15
        ) {

            if (
                !audioCtx ||
                !masterGain
            ) {
                return;
            }

            try {

                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.type =
                    "triangle";

                osc.frequency.value =
                    frequency;

                gain.gain.setValueAtTime(
                    0.025,
                    audioCtx.currentTime
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    audioCtx.currentTime +
                    duration
                );

                osc.connect(gain);
                gain.connect(masterGain);

                osc.start();

                osc.stop(
                    audioCtx.currentTime +
                    duration
                );

            } catch (error) {}
        }


        function playSound(type) {

            if (
                !audioCtx ||
                !masterGain
            ) {
                return;
            }

            try {

                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.connect(gain);
                gain.connect(masterGain);

                const now =
                    audioCtx.currentTime;


                /* -------------------------------------------------
                   MOVE
                   ------------------------------------------------- */

                if (type === "move") {

                    osc.type =
                        "sine";

                    osc.frequency.setValueAtTime(
                        220,
                        now
                    );

                    osc.frequency.exponentialRampToValueAtTime(
                        420,
                        now + 0.07
                    );

                    gain.gain.setValueAtTime(
                        0.055,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.07
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.07
                    );
                }


                /* -------------------------------------------------
                   POWERUP
                   ------------------------------------------------- */

                else if (
                    type === "powerup"
                ) {

                    osc.type =
                        "triangle";

                    osc.frequency.setValueAtTime(
                        320,
                        now
                    );

                    osc.frequency.exponentialRampToValueAtTime(
                        900,
                        now + 0.16
                    );

                    gain.gain.setValueAtTime(
                        0.09,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.18
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.18
                    );
                }


                /* -------------------------------------------------
                   NEAR MISS
                   ------------------------------------------------- */

                else if (
                    type === "nearMiss"
                ) {

                    osc.type =
                        "square";

                    osc.frequency.setValueAtTime(
                        520,
                        now
                    );

                    osc.frequency.exponentialRampToValueAtTime(
                        760,
                        now + 0.08
                    );

                    gain.gain.setValueAtTime(
                        0.045,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.1
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.1
                    );
                }


                /* -------------------------------------------------
                   SHIELD BREAK
                   ------------------------------------------------- */

                else if (
                    type === "shield_break"
                ) {

                    screenShakeTimer =
                        15;

                    flashTimer =
                        8;

                    flashColor =
                        "#00ffcc";

                    osc.type =
                        "sawtooth";

                    osc.frequency.setValueAtTime(
                        220,
                        now
                    );

                    osc.frequency.linearRampToValueAtTime(
                        55,
                        now + 0.28
                    );

                    gain.gain.setValueAtTime(
                        0.12,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.3
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.3
                    );
                }


                /* -------------------------------------------------
                   GAME OVER
                   ------------------------------------------------- */

                else if (
                    type === "gameover"
                ) {

                    screenShakeTimer =
                        30;

                    flashTimer =
                        14;

                    flashColor =
                        "#ff3333";

                    osc.type =
                        "sawtooth";

                    osc.frequency.setValueAtTime(
                        140,
                        now
                    );

                    osc.frequency.linearRampToValueAtTime(
                        25,
                        now + 0.6
                    );

                    gain.gain.setValueAtTime(
                        0.18,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.65
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.65
                    );
                }


                /* -------------------------------------------------
                   COMBO
                   ------------------------------------------------- */

                else if (
                    type === "combo"
                ) {

                    osc.type =
                        "sine";

                    osc.frequency.setValueAtTime(
                        500,
                        now
                    );

                    osc.frequency.exponentialRampToValueAtTime(
                        1000,
                        now + 0.1
                    );

                    gain.gain.setValueAtTime(
                        0.065,
                        now
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        now + 0.12
                    );

                    osc.start(now);

                    osc.stop(
                        now + 0.12
                    );
                }

            } catch (error) {

                console.warn(
                    "Sound error:",
                    error
                );
            }
        }


        /* =========================================================
           AUDIO TOGGLE
           ========================================================= */

        function toggleMute() {

            audioMuted =
                !audioMuted;

            localStorage.setItem(
                "cyberTaxiMuted",
                audioMuted
            );

            if (
                masterGain &&
                audioCtx
            ) {

                masterGain.gain.setTargetAtTime(
                    audioMuted
                        ? 0
                        : 0.65,
                    audioCtx.currentTime,
                    0.03
                );
            }
        }


        /* =========================================================
           GAME SPEED
           ========================================================= */

        function getDifficulty() {

            /*
             * Difficulty intentionally grows in stages.
             * This prevents the game from becoming impossible
             * too quickly.
             */

            const normalized =
                Math.min(
                    score / 3500,
                    1
                );

            return (
                normalized *
                normalized
            );
        }


        function getCurrentSpeed() {

            const difficulty =
                getDifficulty();

            const baseSpeed =
                4.3 +
                difficulty * 5.7;

            return turboActive
                ? Math.min(
                    baseSpeed * 1.65,
                    18
                )
                : baseSpeed;
        }


        /* =========================================================
           PLAYER MOVEMENT
           ========================================================= */

        function movePlayer(direction) {

            if (
                !isPlaying ||
                isPaused ||
                isCountingDown
            ) {
                return;
            }

            const lanes =
                getLanes();

            const newLane =
                playerLane +
                direction;

            if (
                newLane < 0 ||
                newLane >= lanes.length
            ) {
                return;
            }

            playerLane =
                newLane;

            player.targetTilt =
                direction * 0.16;

            player.laneChangeFlash =
                8;

            playSound("move");

            createParticles(
                lanes[playerLane],
                player.y + player.height * 0.7,
                "#00ffcc",
                5
            );
        }


        window.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    event.preventDefault();

                    movePlayer(-1);
                }

                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    event.preventDefault();

                    movePlayer(1);
                }

                if (
                    event.key === " " ||
                    event.key === "Escape"
                ) {

                    event.preventDefault();

                    if (isPlaying) {
                        togglePause();
                    }
                }

            }
        );


        /* =========================================================
           PARTICLES
           ========================================================= */

        function createParticles(
            x,
            y,
            color,
            count = 8,
            options = {}
        ) {

            const speed =
                options.speed ??
                3;

            const gravity =
                options.gravity ??
                0;

            for (
                let i = 0;
                i < count;
                i++
            ) {

                const angle =
                    Math.random() *
                    Math.PI *
                    2;

                const velocity =
                    Math.random() *
                    speed +
                    0.5;

                particles.push({

                    x,
                    y,

                    vx:
                        Math.cos(angle) *
                        velocity,

                    vy:
                        Math.sin(angle) *
                        velocity,

                    radius:
                        Math.random() *
                        2.6 +
                        0.7,

                    color,

                    alpha: 1,

                    decay:
                        Math.random() *
                        0.025 +
                        0.035,

                    gravity

                });
            }
        }


        /* =========================================================
           FEEDBACK
           ========================================================= */

        function showFeedback(
            text,
            color = "#ffffff"
        ) {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "feedback";

            element.textContent =
                text;

            element.style.color =
                color;

            feedbackContainer.appendChild(
                element
            );

            setTimeout(() => {

                element.remove();

            }, 800);
        }


        function addFloatingText(
            text,
            x,
            y,
            color = "#ffffff"
        ) {

            floatingTexts.push({

                text,

                x,

                y,

                color,

                alpha: 1,

                scale: 1,

                velocityY: -1.1

            });
        }


        /* =========================================================
           COMBO
           ========================================================= */

        function increaseCombo() {

            combo++;

            comboTimer =
                240;

            if (combo >= 2) {

                playSound("combo");

                showFeedback(
                    `COMBO x${combo}`,
                    "#ff007f"
                );
            }

            comboHud.textContent =
                `COMBO x${Math.max(combo, 1)}`;

            comboHud.classList.add(
                "visible"
            );
        }


        function resetCombo() {

            if (combo > 1) {

                showFeedback(
                    "COMBO LOST",
                    "#8b949e"
                );
            }

            combo = 0;

            comboTimer = 0;

            comboHud.classList.remove(
                "visible"
            );
        }


        /* =========================================================
           RESIZE INITIALIZATION
           ========================================================= */

        resizeCanvas();

        createCityLights();

        createStars();

        updateStartScreen();


        /* =========================================================
           START GAME
           ========================================================= */

        function startGame() {

            initAudio();

            resizeCanvas();

            score = 0;

            gameTime = 0;

            roadOffset = 0;

            spawnTimer = 0;

            powerupSpawnTimer = 0;

            nearMissTimer = 0;

            combo = 0;

            comboTimer = 0;

            playerLane = 1;

            player.shields = 0;

            player.tilt = 0;

            player.targetTilt = 0;

            player.laneChangeFlash = 0;

            obstacles = [];

            powerups = [];

            particles = [];

            floatingTexts = [];

            activePowerupName =
                "SYSTEM READY";

            powerupTimer = 0;

            turboActive = false;

            screenShakeTimer = 0;

            flashTimer = 0;

            isPaused = false;

            isPlaying = true;

            isCountingDown = true;

            player.y =
                canvas.logicalHeight -
                108;

            startScreen.classList.add(
                "hidden"
            );

            gameOverScreen.classList.add(
                "hidden"
            );

            pauseScreen.classList.add(
                "hidden"
            );

            pauseButton.classList.add(
                "visible"
            );

            comboHud.classList.remove(
                "visible"
            );

            startCountdown();
        }


        /* =========================================================
           COUNTDOWN
           ========================================================= */

        function startCountdown() {

            countdown.classList.add(
                "visible"
            );

            const sequence = [
                "3",
                "2",
                "1",
                "GO!"
            ];

            let index = 0;

            function next() {

                if (
                    !isPlaying
                ) {
                    return;
                }

                countdownText.textContent =
                    sequence[index];

                countdownText.style.transform =
                    "scale(0.65)";

                countdownText.style.opacity =
                    "0";

                requestAnimationFrame(() => {

                    countdownText.style.transition =
                        "transform 0.18s ease-out, opacity 0.18s ease-out";

                    countdownText.style.transform =
                        "scale(1)";

                    countdownText.style.opacity =
                        "1";

                });

                if (
                    sequence[index] ===
                    "GO!"
                ) {

                    playSound("powerup");

                } else {

                    playNote(
                        180 +
                        index * 60,
                        0.12
                    );
                }

                index++;

                if (
                    index <
                    sequence.length
                ) {

                    setTimeout(
                        next,
                        650
                    );

                } else {

                    setTimeout(() => {

                        countdown.classList.remove(
                            "visible"
                        );

                        isCountingDown =
                            false;

                    }, 450);
                }
            }

            next();
        }


        /* =========================================================
           PAUSE
           ========================================================= */

        function togglePause() {

            if (
                !isPlaying ||
                isCountingDown
            ) {
                return;
            }

            isPaused =
                !isPaused;

            if (isPaused) {

                pauseScreen.classList.remove(
                    "hidden"
                );

            } else {

                pauseScreen.classList.add(
                    "hidden"
                );

                lastFrameTime =
                    performance.now();
            }
        }


        function restartFromPause() {

            pauseScreen.classList.add(
                "hidden"
            );

            startGame();
        }


        function returnToTitle() {

            isPlaying = false;

            isPaused = false;

            stopBGM();

            stopEngineSound();

            pauseButton.classList.remove(
                "visible"
            );

            gameOverScreen.classList.add(
                "hidden"
            );

            pauseScreen.classList.add(
                "hidden"
            );

            startScreen.classList.remove(
                "hidden"
            );

            updateStartScreen();
        }


        /* =========================================================
           SPAWN SYSTEM
           ========================================================= */

        function spawnEntity(delta) {

            spawnTimer += delta;

            powerupSpawnTimer += delta;


            const difficulty =
                getDifficulty();


            /*
             * Spawn interval gradually shrinks.
             * It never goes below the safe minimum.
             */

            const spawnInterval =
                Math.max(
                    480,
                    900 -
                    difficulty * 360
                );


            if (
                spawnTimer >=
                spawnInterval
            ) {

                spawnTimer = 0;

                spawnObstacle();
            }


            /*
             * Powerups are deliberately less frequent.
             */

            if (
                powerupSpawnTimer >=
                5200
            ) {

                powerupSpawnTimer =
                    0;

                spawnPowerup();
            }
        }


        function spawnObstacle() {

            const lanes =
                getLanes();

            const candidates = [
                0,
                1,
                2
            ];


            /*
             * Avoid immediately spawning another
             * vehicle directly on top of a recent one.
             */

            const blocked =
                obstacles
                    .filter(
                        obstacle =>
                            obstacle.y <
                            150
                    )
                    .map(
                        obstacle =>
                            obstacle.lane
                    );


            let available =
                candidates.filter(
                    lane =>
                        !blocked.includes(
                            lane
                        )
                );


            if (
                available.length === 0
            ) {
                available =
                    candidates;
            }


            const lane =
                available[
                    Math.floor(
                        Math.random() *
                        available.length
                    )
                ];


            const colorPool = [

                "#ff0066",
                "#d9005b",
                "#ff2d55",
                "#b8004f",
                "#ff1744"

            ];


            obstacles.push({

                lane,

                y: -100,

                width: 44,

                height: 84,

                color:
                    colorPool[
                        Math.floor(
                            Math.random() *
                            colorPool.length
                        )
                    ],

                speedOffset:
                    Math.random() *
                    0.25,

                passed: false,

                nearMissChecked: false

            });
        }


        function spawnPowerup() {

            const candidates = [
                0,
                1,
                2
            ];

            const blocked =
                obstacles
                    .filter(
                        obstacle =>
                            obstacle.y <
                            120
                    )
                    .map(
                        obstacle =>
                            obstacle.lane
                    );

            const available =
                candidates.filter(
                    lane =>
                        !blocked.includes(
                            lane
                        )
                );

            if (
                available.length === 0
            ) {
                return;
            }

            const lane =
                available[
                    Math.floor(
                        Math.random() *
                        available.length
                    )
                ];

            const type =
                Math.random() < 0.55
                    ? "shield"
                    : "turbo";

            powerups.push({

                lane,

                y: -60,

                size: 36,

                type,

                rotation:
                    Math.random() *
                    Math.PI,

                pulse:
                    Math.random() *
                    Math.PI * 2

            });
        }


        /* =========================================================
           COLLISION
           ========================================================= */

        function getPlayerRect() {

            const lanes =
                getLanes();

            const x =
                lanes[playerLane] -
                player.width / 2;

            return {

                x:
                    x + 5,

                y:
                    player.y + 7,

                width:
                    player.width - 10,

                height:
                    player.height - 14

            };
        }


        function getObstacleRect(
            obstacle
        ) {

            const lanes =
                getLanes();

            return {

                x:
                    lanes[
                        obstacle.lane
                    ] -
                    obstacle.width / 2 +
                    5,

                y:
                    obstacle.y + 7,

                width:
                    obstacle.width - 10,

                height:
                    obstacle.height - 14

            };
        }


        function intersects(
            a,
            b
        ) {

            return (
                a.x <
                    b.x + b.width &&
                a.x + a.width >
                    b.x &&
                a.y <
                    b.y + b.height &&
                a.y + a.height >
                    b.y
            );
        }


        /* =========================================================
           GAME OVER
           ========================================================= */

        function gameOver() {

            if (!isPlaying) {
                return;
            }

            isPlaying = false;

            isPaused = false;

            isCountingDown = false;

            stopBGM();

            playSound("gameover");

            const lanes =
                getLanes();

            createParticles(
                lanes[playerLane],
                player.y + player.height / 2,
                "#ff007f",
                35,
                {
                    speed: 5,
                    gravity: 0.06
                }
            );

            createParticles(
                lanes[playerLane],
                player.y + player.height / 2,
                "#ffb86c",
                18,
                {
                    speed: 3,
                    gravity: 0.03
                }
            );

            const finalScore =
                Math.floor(score);

            let newRecord = false;

            if (
                finalScore >
                bestScore
            ) {

                bestScore =
                    finalScore;

                localStorage.setItem(
                    "cyberTaxiBest",
                    bestScore
                );

                newRecord = true;
            }

            finalScoreText.textContent =
                finalScore
                    .toString()
                    .padStart(4, "0");

            bestScoreText.textContent =
                newRecord
                    ? "★ NEW RECORD ★"
                    : `BEST: ${
                        bestScore
                            .toString()
                            .padStart(4, "0")
                    }`;

            bestScoreText.classList.toggle(
                "new-record",
                newRecord
            );

            pauseButton.classList.remove(
                "visible"
            );

            setTimeout(() => {

                gameOverScreen.classList.remove(
                    "hidden"
                );

            }, 500);
        }


        /* =========================================================
           START SCREEN DATA
           ========================================================= */

        function updateStartScreen() {

            startBestScore.textContent =
                bestScore
                    .toString()
                    .padStart(4, "0");
        }

    </script>
