<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Taxi Dodger</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #090d16;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 100vh;
            background: #111827;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            flex-grow: 1;
            background: #1e293b;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 5;
        }
        .header-hud {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .status-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            background: rgba(15, 23, 42, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .mobile-controls {
            display: flex;
            width: 100%;
            height: 90px;
            background: #0f172a;
            border-top: 2px solid #334155;
            flex-shrink: 0;
        }
        .control-btn {
            flex: 1;
            background: #1e293b;
            border: none;
            color: #38bdf8;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .control-btn:active {
            background: #334155;
            color: #bae6fd;
        }
        .control-btn:first-child {
            border-right: 2px solid #334155;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas Game -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Informasi Permainan -->
        <div class="ui-layer">
            <div class="header-hud">
                <span id="scoreDisplay">SCORE: 0</span>
                <span id="speedDisplay" style="color: #38bdf8;">1.0x</span>
            </div>
            <div class="status-hud">
                <span id="shieldStatus">SHIELD: 0 🛡️</span>
                <span id="activePowerup" style="color: #facc15;">-</span>
            </div>
        </div>

        <!-- Tombol Kontrol Layar Smartphone -->
        <div class="mobile-controls">
            <button class="control-btn" onclick="movePlayer(-1)">◀ KIRI</button>
            <button class="control-btn" onclick="movePlayer(1)">KANAN ▶</button>
        </div>

        <!-- Layar Mulai / Game Over -->
        <div id="startScreen" class="screen">
            <h1>TURBO TAXI</h1>
            <p>Hindari rintangan, tumpuk Shield sebanyak mungkin, ambil Turbo untuk ngebut & skor ganda!</p>
            <button class="btn" onclick="startGame()">MULAI GAS</button>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <h1>GAME OVER</h1>
            <p id="finalScoreText">Skor Akhir: 0</p>
            <button class="btn" onclick="startGame()">MAIN LAGI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight - document.querySelector('.mobile-controls').offsetHeight;
        }

        const container = document.getElementById("game-container");
        resizeCanvas();

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === "move") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(500, now + 0.05);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === "powerup") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === "shield_break") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === "gameover") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.4);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (e) {
                console.log(e);
            }
        }

        let isPlaying = false;
        let score = 0;
        let gameSpeed = 4;
        let roadOffset = 0;
        
        const getLanes = () => [canvas.width / 2 - 75, canvas.width / 2, canvas.width / 2 + 75];
        let playerLane = 1;

        let player = {
            width: 36,
            height: 64,
            y: 0,
            shields: 0 // Sistem tumpuk shield
        };

        let obstacles = [];
        let powerups = [];
        let particles = [];
        let activePowerupName = "-";
        let powerupTimer = 0;
        let turboActive = false;
        let spawnTimer = 0;

        function movePlayer(direction) {
            if (!isPlaying) return;
            let lanes = getLanes();
            let newLane = playerLane + direction;
            if (newLane >= 0 && newLane < lanes.length) {
                playerLane = newLane;
                playSound("move");
                createParticles(lanes[playerLane], player.y + 32, "#38bdf8", 4);
            }
        }

        window.addEventListener("keydown", (e) => {
            if (!isPlaying) return;
            if (e.key === "ArrowLeft" || e.key === "a") movePlayer(-1);
            if (e.key === "ArrowRight" || e.key === "d") movePlayer(1);
        });

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function startGame() {
            initAudio();
            resizeCanvas();
            player.y = canvas.height - 100;

            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("gameOverScreen").classList.add("hidden");
            
            score = 0;
            gameSpeed = 4;
            playerLane = 1;
            obstacles = [];
            powerups = [];
            particles = [];
            player.shields = 0;
            turboActive = false;
            activePowerupName = "-";
            powerupTimer = 0;
            spawnTimer = 0;
            isPlaying = true;
            
            loop();
        }

        function gameOver() {
            isPlaying = false;
            playSound("gameover");
            let lanes = getLanes();
            createParticles(lanes[playerLane], player.y, "#f43f5e", 20);
            document.getElementById("finalScoreText").innerText = `Skor Akhir: ${Math.floor(score)}`;
            document.getElementById("gameOverScreen").classList.remove("hidden");
        }

        function spawnEntity() {
            spawnTimer++;
            let lanes = getLanes();
            if (spawnTimer % 45 === 0) {
                let randomLane = Math.floor(Math.random() * lanes.length);
                obstacles.push({
                    lane: randomLane,
                    y: -70,
                    width: 36,
                    height: 64,
                    color: "#f43f5e"
                });
            }
            if (spawnTimer % 170 === 0) {
                let randomLane = Math.floor(Math.random() * lanes.length);
                let types = ["shield", "turbo"];
                let chosenType = types[Math.floor(Math.random() * types.length)];
                powerups.push({
                    lane: randomLane,
                    y: -40,
                    size: 30,
                    type: chosenType
                });
            }
        }

        function update() {
            gameSpeed = 4 + (score / 400);
            let currentSpeed = turboActive ? gameSpeed * 1.6 : gameSpeed;

            roadOffset += currentSpeed;
            if (roadOffset > 40) roadOffset = 0;

            score += turboActive ? 0.5 : 0.2;

            if (powerupTimer > 0) {
                powerupTimer--;
                if (powerupTimer <= 0) {
                    turboActive = false;
                    activePowerupName = "-";
                }
            }

            spawnEntity();
            let lanes = getLanes();

            // Update Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += currentSpeed;
                if (
                    obstacles[i].lane === playerLane &&
                    obstacles[i].y < player.y + player.height &&
                    obstacles[i].y + obstacles[i].height > player.y
                ) {
                    if (player.shields > 0) {
                        player.shields--; // Kurangi simpanan shield
                        playSound("shield_break");
                        createParticles(lanes[playerLane], player.y, "#22c55e", 15);
                        obstacles.splice(i, 1);
                    } else {
                        gameOver();
                        return;
                    }
                } else if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            // Update Power-ups
            for (let i = powerups.length - 1; i >= 0; i--) {
                powerups[i].y += currentSpeed;
                if (
                    powerups[i].lane === playerLane &&
                    powerups[i].y < player.y + player.height &&
                    powerups[i].y + powerups[i].size > player.y
                ) {
                    playSound("powerup");
                    createParticles(lanes[playerLane], powerups[i].y, "#eab308", 12);

                    if (powerups[i].type === "shield") {
                        player.shields++; // Tambah jumlah tumpukan shield
                        activePowerupName = `SHIELD (+1)`;
                    } else if (powerups[i].type === "turbo") {
                        turboActive = true;
                        activePowerupName = "TURBO SPEED!";
                        powerupTimer = 220;
                    }
                    powerups.splice(i, 1);
                } else if (powerups[i].y > canvas.height) {
                    powerups.splice(i, 1);
                }
            }

            // Update Partikel
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background Jalan Aspal
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bahu Jalan Samping
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, 20, canvas.height);
            ctx.fillRect(canvas.width - 20, 0, 20, canvas.height);

            // Garis Marka Jalan Bergerak
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 25]);
            ctx.lineDashOffset = -roadOffset;

            let lanes = getLanes();
            ctx.beginPath();
            ctx.moveTo((lanes[0] + lanes[1]) / 2, 0);
            ctx.lineTo((lanes[0] + lanes[1]) / 2, canvas.height);
            ctx.moveTo((lanes[1] + lanes[2]) / 2, 0);
            ctx.lineTo((lanes[1] + lanes[2]) / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Gambar Partikel
            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Gambar Mobil Player (Taksi Geometris Menghadap ke Atas)
            let targetX = lanes[playerLane] - player.width / 2;
            ctx.fillStyle = "#38bdf8"; // Badan Taksi
            ctx.fillRect(targetX, player.y, player.width, player.height);
            ctx.fillStyle = "#0f172a"; // Kaca Depan & Belakang
            ctx.fillRect(targetX + 4, player.y + 10, player.width - 8, 14);
            ctx.fillRect(targetX + 4, player.y + player.height - 18, player.width - 8, 10);

            // Efek Lingkaran Pelindung Shield (Jika Ada Simpanan)
            if (player.shields > 0) {
                ctx.strokeStyle = "#22c55e";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(targetX + player.width / 2, player.y + player.height / 2, 34, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Gambar Mobil Obstacle (Menghadap ke Atas)
            for (let obs of obstacles) {
                let obsX = lanes[obs.lane] - obs.width / 2;
                ctx.fillStyle = obs.color;
                ctx.fillRect(obsX, obs.y, obs.width, obs.height);
                ctx.fillStyle = "#0f172a"; // Kaca musuh
                ctx.fillRect(obsX + 4, obs.y + 10, obs.width - 8, 14);
            }

            // Gambar Power-up (Bentuk Barel / Kotak Neon)
            for (let p of powerups) {
                let pX = lanes[p.lane] - p.size / 2;
                ctx.fillStyle = p.type === "shield" ? "#22c55e" : "#eab308";
                ctx.fillRect(pX, p.y, p.size, p.size);
                
                // Huruf Singkatan di dalam Power-up
                ctx.fillStyle = "#0f172a";
                ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(p.type === "shield" ? "S" : "T", lanes[p.lane], p.y + p.size / 2);
            }

            // Update Tampilan HUD
            document.getElementById("scoreDisplay").innerText = `SCORE: ${Math.floor(score)}`;
            document.getElementById("speedDisplay").innerText = `${gameSpeed.toFixed(1)}x`;
            document.getElementById("shieldStatus").innerText = `SHIELD: ${player.shields} 🛡️`;
            document.getElementById("activePowerup").innerText = activePowerupName;
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
