<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Taxi Arcade</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            font-family: 'VT323', monospace;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 100vh;
            background: #090a0f;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            overflow: hidden;
            border: 2px solid #1f293d;
        }
        canvas {
            display: block;
            width: 100%;
            flex-grow: 1;
            background: #0d1117;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            z-index: 5;
        }
        .header-hud {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }
        .status-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            background: rgba(13, 17, 23, 0.85);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #1f293d;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
        }
        .mobile-controls {
            display: flex;
            width: 100%;
            height: 90px;
            background: #050508;
            border-top: 2px solid #1f293d;
            flex-shrink: 0;
        }
        .control-btn {
            flex: 1;
            background: #0d1117;
            border: none;
            color: #00ffcc;
            font-family: 'VT323', monospace;
            font-size: 32px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .control-btn:active {
            background: #1f293d;
            color: #ffffff;
            box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .control-btn:first-child {
            border-right: 2px solid #1f293d;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 5px;
            color: #ff007f;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.7);
            letter-spacing: 3px;
        }
        p {
            color: #8b949e;
            font-size: 20px;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .btn {
            background: #00ffcc;
            color: #050508;
            border: none;
            padding: 10px 30px;
            font-family: 'VT323', monospace;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: all 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            background: #ffffff;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas Game -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Layer -->
        <div class="ui-layer">
            <div class="header-hud">
                <span id="scoreDisplay">SCORE: 0000</span>
                <span id="speedDisplay" style="color: #ff007f;">1.0X</span>
            </div>
            <div class="status-hud">
                <span id="shieldStatus">SHIELD: 0 🛡️</span>
                <span id="activePowerup" style="color: #ffb86c;">READY</span>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div class="mobile-controls">
            <button class="control-btn" onclick="movePlayer(-1)">&lt; LEFT</button>
            <button class="control-btn" onclick="movePlayer(1)">RIGHT &gt;</button>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="screen">
            <h1>CYBER TAXI</h1>
            <p>DETAILED CAR SILHOUETTES • UNIFORM OBSTACLES<br>FAST ARCADE ACTION</p>
            <button class="btn" onclick="startGame()">INSERT COIN</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen hidden">
            <h1 style="color: #ff3333; text-shadow: 0 0 15px rgba(255,51,51,0.7);">GAME OVER</h1>
            <p id="finalScoreText">FINAL SCORE: 0</p>
            <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight - document.querySelector('.mobile-controls').offsetHeight;
        }

        const container = document.getElementById("game-container");
        resizeCanvas();

        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startEngineSound();
        }

        function startEngineSound() {
            if (engineOsc) return;
            try {
                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();
                
                engineOsc.type = "sawtooth";
                engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
                
                let filter = audioCtx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.setValueAtTime(180, audioCtx.currentTime);

                engineGain.gain.setValueAtTime(0.02, audioCtx.currentTime);

                engineOsc.connect(filter);
                filter.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                
                engineOsc.start();
            } catch (e) {
                console.log(e);
            }
        }

        function stopEngineSound() {
            if (engineOsc) {
                try {
                    engineOsc.stop();
                    engineOsc.disconnect();
                } catch(e) {}
                engineOsc = null;
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === "move") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(320, now + 0.06);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === "powerup") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === "shield_break") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.25);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === "gameover") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(20, now + 0.5);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {
                console.log(e);
            }
        }

        let isPlaying = false;
        let score = 0;
        let gameSpeed = 4;
        let roadOffset = 0;
        
        const getLanes = () => [canvas.width / 2 - 75, canvas.width / 2, canvas.width / 2 + 75];
        let playerLane = 1;

        let player = {
            width: 42,
            height: 80,
            y: 0,
            shields: 0
        };

        let obstacles = [];
        let powerups = [];
        let particles = [];
        let activePowerupName = "READY";
        let powerupTimer = 0;
        let turboActive = false;
        let spawnTimer = 0;

        function movePlayer(direction) {
            if (!isPlaying) return;
            let lanes = getLanes();
            let newLane = playerLane + direction;
            if (newLane >= 0 && newLane < lanes.length) {
                playerLane = newLane;
                playSound("move");
                createParticles(lanes[playerLane], player.y + 40, "#00ffcc", 5);
            }
        }

        window.addEventListener("keydown", (e) => {
            if (!isPlaying) return;
            if (e.key === "ArrowLeft" || e.key === "a") movePlayer(-1);
            if (e.key === "ArrowRight" || e.key === "d") movePlayer(1);
        });

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function startGame() {
            initAudio();
            resizeCanvas();
            player.y = canvas.height - 110;

            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("gameOverScreen").classList.add("hidden");
            
            score = 0;
            gameSpeed = 4.5;
            playerLane = 1;
            obstacles = [];
            powerups = [];
            particles = [];
            player.shields = 0;
            turboActive = false;
            activePowerupName = "READY";
            powerupTimer = 0;
            spawnTimer = 0;
            isPlaying = true;
            
            loop();
        }

        function gameOver() {
            isPlaying = false;
            stopEngineSound();
            playSound("gameover");
            let lanes = getLanes();
            createParticles(lanes[playerLane], player.y, "#ff007f", 25);
            document.getElementById("finalScoreText").innerText = `FINAL SCORE: ${Math.floor(score)}`;
            document.getElementById("gameOverScreen").classList.remove("hidden");
        }

        function spawnEntity() {
            spawnTimer++;
            let lanes = getLanes();
            
            if (spawnTimer % Math.max(22, 45 - Math.floor(score / 150)) === 0) {
                let availableLanes = [0, 1, 2];
                let chosenLane = availableLanes[Math.floor(Math.random() * availableLanes.length)];
                
                obstacles.push({
                    lane: chosenLane,
                    y: -85,
                    width: 42,
                    height: 80
                });
            }

            if (spawnTimer % 160 === 0) {
                let obstacleLanes = obstacles.filter(o => o.y < 50).map(o => o.lane);
                let safeLanes = [0, 1, 2].filter(l => !obstacleLanes.includes(l));
                
                if (safeLanes.length > 0) {
                    let chosenLane = safeLanes[Math.floor(Math.random() * safeLanes.length)];
                    let types = ["shield", "turbo"];
                    let chosenType = types[Math.floor(Math.random() * types.length)];
                    
                    powerups.push({
                        lane: chosenLane,
                        y: -50,
                        size: 34,
                        type: chosenType
                    });
                }
            }
        }

        function update() {
            gameSpeed = 4.5 + (score / 200);
            let currentSpeed = turboActive ? gameSpeed * 1.8 : gameSpeed;

            roadOffset += currentSpeed;
            if (roadOffset > 40) roadOffset = 0;

            score += turboActive ? 0.8 : 0.3;

            if (powerupTimer > 0) {
                powerupTimer--;
                if (powerupTimer <= 0) {
                    turboActual = false;
                    turboActive = false;
                    activePowerupName = "NORMAL";
                }
            }

            spawnEntity();
            let lanes = getLanes();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += currentSpeed;
                if (
                    obstacles[i].lane === playerLane &&
                    obstacles[i].y < player.y + player.height &&
                    obstacles[i].y + obstacles[i].height > player.y
                ) {
                    if (player.shields > 0) {
                        player.shields--;
                        playSound("shield_break");
                        createParticles(lanes[playerLane], player.y, "#00ffcc", 18);
                        obstacles.splice(i, 1);
                    } else {
                        gameOver();
                        return;
                    }
                } else if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                powerups[i].y += currentSpeed;
                if (
                    powerups[i].lane === playerLane &&
                    powerups[i].y < player.y + player.height &&
                    powerups[i].y + powerups[i].size > player.y
                ) {
                    playSound("powerup");
                    createParticles(lanes[playerLane], powerups[i].y, "#ffb86c", 15);

                    if (powerups[i].type === "shield") {
                        player.shields++;
                        activePowerupName = `SHIELD +1`;
                    } else if (powerups[i].type === "turbo") {
                        turboActive = true;
                        activePowerupName = "TURBO BOOST!";
                        powerupTimer = 180;
                    }
                    powerups.splice(i, 1);
                } else if (powerups[i].y > canvas.height) {
                    powerups.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.05;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // Fungsi render mobil yang disempurnakan menyerupai siluet bodi mobil sport/sedan asli
        function drawDetailedCar(x, y, w, h, primaryColor, isPlayer) {
            ctx.save();
            let cx = x - w / 2;

            // Roda Mobil (Ban Samping)
            ctx.fillStyle = "#030305";
            ctx.fillRect(cx - 5, y + 14, 5, 18);
            ctx.fillRect(cx + w, y + 14, 5, 18);
            ctx.fillRect(cx - 5, y + h - 24, 5, 18);
            ctx.fillRect(cx + w, y + h - 24, 5, 18);

            // Bodi Utama Mobil dengan Kurva Melengkung
            ctx.fillStyle = primaryColor;
            ctx.beginPath();
            // Moncong Depan
            ctx.moveTo(cx + 10, y + 4);
            ctx.lineTo(cx + w - 10, y + 4);
            // Fender Depan ke Pintu Samping
            ctx.quadraticCurveTo(cx + w - 2, y + 12, cx + w, y + 26);
            ctx.lineTo(cx + w - 2, y + h - 8);
            // Bumper Belakang
            ctx.quadraticCurveTo(cx + w / 2, y + h, cx + 2, y + h - 8);
            ctx.lineTo(cx, y + 26);
            // Fender Kiri Depan
            ctx.quadraticCurveTo(cx + 2, y + 12, cx + 10, y + 4);
            ctx.closePath();
            ctx.fill();

            // Outline tipis bodi
            ctx.strokeStyle = isPlayer ? "#ffffff" : "#ff1a75";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Kap Mesin / Hidung Detail
            ctx.fillStyle = isPlayer ? "#00cca3" : "#cc0052";
            ctx.fillRect(cx + 10, y + 6, w - 20, 10);

            // Kaca Depan (Windshield Melengkung)
            ctx.fillStyle = "#050508";
            ctx.beginPath();
            ctx.moveTo(cx + 8, y + 18);
            ctx.lineTo(cx + w - 8, y + 18);
            ctx.lineTo(cx + w - 6, y + 36);
            ctx.lineTo(cx + 6, y + 36);
            ctx.closePath();
            ctx.fill();

            // Atap Mobil & Kaca Belakang
            ctx.fillRect(cx + 7, y + 40, w - 14, 18);

            // Lampu Depan (Headlights) & Lampu Belakang (Tailights)
            if (isPlayer) {
                ctx.fillStyle = "#ffff00"; // Kuning terang taksi
                ctx.fillRect(cx + 3, y + 2, 8, 4);
                ctx.fillRect(cx + w - 11, y + 2, 8, 4);
            } else {
                ctx.fillStyle = "#ff3333"; // Lampu merah rem musuh
                ctx.fillRect(cx + 3, y + h - 4, 8, 4);
                ctx.fillRect(cx + w - 11, y + h - 4, 8, 4);
                // Lampu depan musuh
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(cx + 4, y + 2, 6, 3);
                ctx.fillRect(cx + w - 10, y + 2, 6, 3);
            }

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Retro Asphalt Road
            ctx.fillStyle = "#0d1117";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sidewalk Shoulders
            ctx.fillStyle = "#161b22";
            ctx.fillRect(0, 0, 18, canvas.height);
            ctx.fillRect(canvas.width - 18, 0, 18, canvas.height);

            // Neon Road Striping Line
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;

            let lanes = getLanes();
            ctx.beginPath();
            ctx.moveTo((lanes[0] + lanes[1]) / 2, 0);
            ctx.lineTo((lanes[0] + lanes[1]) / 2, canvas.height);
            ctx.moveTo((lanes[1] + lanes[2]) / 2, 0);
            ctx.lineTo((lanes[1] + lanes[2]) / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Player Car (Cyber Taxi - Warna Hijau Neon)
            drawDetailedCar(lanes[playerLane], player.y, player.width, player.height, "#00ffcc", true);

            // Shield Aura Ring
            if (player.shields > 0) {
                ctx.strokeStyle = "#00ffcc";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(lanes[playerLane], player.y + player.height / 2, 42, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw Obstacle Cars (Musuh - 1 Warna Seragam Merah Menyala Khas Cyberpunk)
            for (let obs of obstacles) {
                drawDetailedCar(lanes[obs.lane], obs.y, obs.width, obs.height, "#ff0066", false);
            }

            // Draw Power-ups
            for (let p of powerups) {
                let px = lanes[p.lane];
                let py = p.y + p.size / 2;
                
                ctx.save();
                ctx.fillStyle = p.type === "shield" ? "#00ffcc" : "#ffb86c";
                ctx.beginPath();
                ctx.arc(px, py, p.size / 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = "#050508";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = "#050508";
                ctx.font = "bold 18px 'VT323', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(p.type === "shield" ? "S" : "T", px, py);
                ctx.restore();
            }

            // CRT Scanline Overlay Effect
            ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
            for (let sy = 0; sy < canvas.height; sy += 4) {
                ctx.fillRect(0, sy, canvas.width, 1);
            }

            document.getElementById("scoreDisplay").innerText = `SCORE: ${Math.floor(score).toString().padStart(4, '0')}`;
            document.getElementById("speedDisplay").innerText = `${gameSpeed.toFixed(1)}X`;
            document.getElementById("shieldStatus").innerText = `SHIELD: ${player.shields} 🛡️`;
            document.getElementById("activePowerup").innerText = activePowerupName;
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
