<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Cyber Taxi Arcade</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <div id="game-container">

        <!-- =================================
             GAME CANVAS
             ================================= -->

        <canvas id="gameCanvas"></canvas>


        <!-- =================================
             HUD
             ================================= -->

        <div class="ui-layer">

            <div class="header-hud">

                <span id="scoreDisplay">
                    SCORE: 0000
                </span>

                <span
                    id="speedDisplay"
                    style="color: #ff007f;"
                >
                    1.0X
                </span>

            </div>


            <div class="status-hud">

                <span id="shieldStatus">
                    SHIELD: 0 🛡️
                </span>

                <span
                    id="activePowerup"
                    style="color: #ffb86c;"
                >
                    READY
                </span>

            </div>

        </div>


        <!-- =================================
             MOBILE CONTROLS
             ================================= -->

        <div class="mobile-controls">

            <button
                class="control-btn"
                id="leftButton"
            >
                &lt; LEFT
            </button>


            <button
                class="control-btn"
                id="rightButton"
            >
                RIGHT &gt;
            </button>

        </div>


        <!-- =================================
             START SCREEN
             ================================= -->

        <div
            id="startScreen"
            class="screen"
        >

            <h1>
                CYBER TAXI
            </h1>


            <p>
                Dodge the Grid. Own the Neon Night.
            </p>


            <button
                class="btn"
                id="startButton"
            >
                INSERT COIN
            </button>

        </div>


        <!-- =================================
             GAME OVER SCREEN
             ================================= -->

        <div
            id="gameOverScreen"
            class="screen hidden"
        >

            <h1 class="game-over-title">
                GAME OVER
            </h1>


            <p
                id="finalScoreText"
                class="final-score"
            >
                FINAL SCORE: 0
            </p>


            <button
                class="btn"
                id="restartButton"
            >
                PLAY AGAIN
            </button>

        </div>

    </div>


    <!-- =====================================
         GAME JAVASCRIPT
         ===================================== -->

    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
