        /* =========================
           COMBO SYSTEM
        ========================== */

        let combo = 0;
        let comboTimer = 0;

        const COMBO_TIMEOUT =
            105;

        function registerNearMiss() {
            combo++;

            comboTimer =
                COMBO_TIMEOUT;

            const multiplier =
                Math.min(
                    combo,
                    9
                );

            const bonus =
                5 * multiplier;

            score += bonus;

            comboHud.innerText =
                `COMBO x${multiplier}  +${bonus}`;

            comboHud.style.opacity =
                "1";

            comboHud.style.transform =
                "translateX(-50%) scale(1.08)";

            setTimeout(() => {
                comboHud.style.transform =
                    "translateX(-50%) scale(1)";
            }, 80);

            addFloatingText(
                `+${bonus}`,
                player.x,
                player.y - 25,
                COLORS.orange
            );
        }

        function updateCombo() {
            if (
                comboTimer > 0
            ) {
                comboTimer--;

                if (
                    comboTimer <= 0
                ) {
                    combo = 0;

                    comboHud.style.opacity =
                        "0";
                }
            }
        }

        /* =========================
           NEAR MISS DETECTION
        ========================== */

        function checkNearMiss(car) {
            if (
                car.nearMissChecked
            ) {
                return;
            }

            /*
             * Hanya cek ketika mobil sudah
             * melewati area player.
             */
            if (
                car.y <
                player.y - 20
            ) {
                return;
            }

            if (
                car.y >
                player.y +
                player.height +
                30
            ) {
                return;
            }

            car.nearMissChecked =
                true;

            /*
             * Jika obstacle berada di lane
             * sebelah player dan sangat dekat,
             * beri bonus.
             */
            const laneDistance =
                Math.abs(
                    car.lane -
                    player.lane
                );

            if (
                laneDistance === 1
            ) {
                registerNearMiss();
            }
        }

        /* =========================
           SPAWN SAFETY
        ========================== */

        function canSpawnObstacle(
            lane
        ) {
            return !obstacles.some(
                car =>
                    car.lane === lane &&
                    car.y < 155
            );
        }

            countdownValue = 3;

            const countdown =
                document.createElement(
                    "div"
                );

            countdown.id =
                "countdown";

            countdown.style.cssText = `
                position:absolute;
                inset:0;

                display:flex;

                justify-content:center;

                color:#fff;

                font-family:
                    VT323,monospace;

                pointer-events:none;
                z-index:35;
            `;

            countdown.innerText =
                countdownValue;

            container.appendChild(
                countdown
            );

            const timer =
                setInterval(() => {
                    countdownValue--;

                    if (
                        countdownValue > 0
                    ) {
                        countdown.innerText =

                    }

                    if (

                    }

                    setTimeout(() => {
                        clearInterval(
                            timer
                        );

                        countdown.remove();

                        countdownActive =
                            false;

                        callback();
                    }, 350);
                }, 650);
        }

        };

        /* =========================
           UPDATE PATCH
        ========================== */

        const previousUpdate =
            update;

        update = function() {
            if (
                !isPlaying ||
                isPaused ||
                countdownActive
            ) {
                return;
            }

            previousUpdate();

            updateCombo();

            /*
             * Check near misses after
             * normal obstacle movement.
             */
            for (
                const car of obstacles
            ) {
                checkNearMiss(car);
            }

            bestHud.innerText =
                `BEST: ${highScore}`;
        };

        /* =========================
           GAME OVER UI POLISH
        ========================== */

        const gameOverTitle =
            document.querySelector(
                "#gameOverScreen h1"
            );

        if (gameOverTitle) {
            gameOverTitle.style.fontSize =
                "clamp(45px, 13vw, 64px)";
        }

        /* =========================
           START SCREEN INFO
        ========================== */

        const startScreen =
            document.getElementById(
                "startScreen"
            );

        if (startScreen) {
            const info =
                document.createElement(
                    "div"
                );

            info.style.cssText = `
                margin-top:24px;

                color:#526174;

                font-size:16px;
                letter-spacing:1px;

                line-height:1.3;
            `;

            info.innerHTML =
                `
                ← → / A D &nbsp; MOVE<br>
                SWIPE &nbsp; MOBILE<br>
                SPACE / P &nbsp; PAUSE
                `;

            startScreen.appendChild(
                info
            );
        }

        /* =========================
           FINAL RENDER PATCH
        ========================== */

        const previousDraw =
            draw;

        draw = function() {
            previousDraw();

            /*
             * Small turbo HUD indicator.
             */
            if (
                turboTimer > 0 &&
                isPlaying
            ) {
                ctx.save();

                const w =
                    gameWidth();

                const barWidth =
                    Math.min(
                        110,
                        w * .32
                    );

                const progress =
                    turboTimer /
                    TURBO_DURATION;

                const x =
                    w / 2 -
                    barWidth / 2;

                const y =
                    92;

                ctx.fillStyle =
                    "rgba(0,0,0,.55)";

                ctx.fillRect(
                    x,
                    y,
                    barWidth,
                    4
                );

                ctx.fillStyle =
                    COLORS.orange;

                ctx.shadowColor =
                    COLORS.orange;

                ctx.shadowBlur = 8;

                ctx.fillRect(
                    x,
                    y,
                    barWidth *
                    progress,
                    4
                );

                ctx.restore();
            }
        };

        /* =========================
           START SCREEN RENDER
        ========================== */

        draw();

        /* =========================
           VISIBILITY HANDLING
        ========================== */

        document.addEventListener(
            "visibilitychange",
            () => {
                if (
                    document.hidden &&
                    isPlaying &&
                    !isPaused
                ) {
                    togglePause();
                }
            }
        );

        /* =========================
           PREVENT DOUBLE TAP
        ========================== */

        let lastTap = 0;

        document.addEventListener(
            "touchend",
            event => {
                const now =
                    Date.now();

                if (
                    now - lastTap <
                    280
                ) {
                    event.preventDefault();
                }

                lastTap = now;
            },
            { passive: false }
        );
        /* =========================
           FINAL POLISH / BUG FIX
        ========================== */

        /* ---------- SAFE HELPERS ---------- */

        function safeNumber(value, fallback = 0) {
            return Number.isFinite(value)
                ? value
                : fallback;
        }

        function refreshBestScore() {
            highScore = safeNumber(
                Number(
                    localStorage.getItem(
                        "cyberTaxiHighScore"
                    )
                ),
                0
            );

            const best =
                document.getElementById(
                    "bestHud"
                );

            if (best) {
                best.innerText =
                    `BEST: ${highScore}`;
            }
        }

        /* ---------- RESPONSIVE RESIZE ---------- */

        let resizeTimeout = null;

        function handleResize() {
            clearTimeout(
                resizeTimeout
            );

            resizeTimeout =
                setTimeout(() => {
                    const oldHeight =
                        canvas.height;

                    resizeCanvas();

                    if (
                        !isFinite(canvas.width) ||
                        !isFinite(canvas.height)
                    ) {
                        return;
                    }

                    /*
                     * Player tetap berada di
                     * posisi bawah layar setelah resize.
                     */
                    const targetY =
                        canvas.height -
                        112;

                    if (
                        !Number.isFinite(
                            player.y
                        ) ||
                        oldHeight <= 0
                    ) {
                        player.y =
                            targetY;
                    } else {
                        const ratio =
                            canvas.height /
                            oldHeight;

                        player.y =
                            clamp(
                                player.y *
                                ratio,
                                20,
                                targetY
                            );
                    }

                    updateLanePositions(
                        false
                    );

                    player.targetX =
                        getLanes()[
                            player.lane
                        ];

                    if (
                        !isPlaying
                    ) {
                        draw();
                    }
                }, 80);
        }

        window.addEventListener(
            "resize",
            handleResize,
            { passive: true }
        );

        window.addEventListener(
            "orientationchange",
            () => {
                setTimeout(
                    handleResize,
                    120
                );
            },
            { passive: true }
        );

        /* ---------- SWIPE CONTROL ---------- */

        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;

        canvas.addEventListener(
            "touchstart",
            event => {
                if (
                    !isPlaying ||
                    countdownActive
                ) {
                    return;
                }

                const touch =
                    event.changedTouches[0];

                touchStartX =
                    touch.clientX;

                touchStartY =
                    touch.clientY;

                touchStartTime =
                    Date.now();
            },
            { passive: true }
        );

        canvas.addEventListener(
            "touchend",
            event => {
                if (
                    !isPlaying ||
                    countdownActive
                ) {
                    return;
                }

                const touch =
                    event.changedTouches[0];

                const dx =
                    touch.clientX -
                    touchStartX;

                const dy =
                    touch.clientY -
                    touchStartY;

                const duration =
                    Date.now() -
                    touchStartTime;

                /*
                 * Hanya anggap sebagai swipe
                 * jika gerak horizontal cukup besar.
                 */
                if (
                    duration < 550 &&
                    Math.abs(dx) > 35 &&
                    Math.abs(dx) >
                        Math.abs(dy) * 1.25
                ) {
                    movePlayer(
                        dx > 0
                            ? 1
                            : -1
                    );
                }
            },
            { passive: true }
        );

        /* ---------- KEYBOARD ---------- */

        window.addEventListener(
            "keydown",
            event => {
                const key =
                    event.key.toLowerCase();

                if (
                    key === "p" ||
                    key === " "
                ) {
                    event.preventDefault();

                    if (
                        isPlaying &&
                        !countdownActive
                    ) {
                        togglePause();
                    }

                    return;
                }

                if (
                    key === "arrowleft" ||
                    key === "a"
                ) {
                    event.preventDefault();

                    movePlayer(-1);

                    return;
                }

                if (
                    key === "arrowright" ||
                    key === "d"
                ) {
                    event.preventDefault();

                    movePlayer(1);
                }
            }
        );

        /* ---------- PLAYER MOVEMENT PATCH ---------- */

        const originalMovePlayer =
            movePlayer;

        movePlayer = function(
            direction
        ) {
            if (
                !isPlaying ||
                isPaused ||
                countdownActive
            ) {
                return;
            }

            if (
                player.moveCooldown > 0
            ) {
                return;
            }

            const oldLane =
                player.lane;

            originalMovePlayer(
                direction
            );

            if (
                player.lane !== oldLane
            ) {
                player.moveCooldown = 4;

                /*
                 * Sedikit squash/stretch
                 * saat pindah lane.
                 */
                player.steeringPunch =
                    direction;
            }
        };

        /* ---------- PLAYER VISUAL MOTION ---------- */

        function updatePlayerPolish() {
            if (
                player.steeringPunch
            ) {
                player.steeringPunch *=
                    .72;

                if (
                    Math.abs(
                        player.steeringPunch
                    ) < .05
                ) {
                    player.steeringPunch = 0;
                }
            }

            if (
                player.hitCooldown > 0
            ) {
                player.hitCooldown--;
            }
        }

        /* ---------- COLLISION INVULNERABILITY PATCH ---------- */

        const originalHandleCollision =
            handleCollision;

        handleCollision = function(
            car,
            index
        ) {
            if (
                player.hitCooldown > 0
            ) {
                return;
            }

            originalHandleCollision(
                car,
                index
            );
        };

        /* ---------- EXTRA CAR DETAIL ---------- */

        function drawCarGlow(
            x,
            y,
            color,
            intensity = 1
        ) {
            ctx.save();

            ctx.globalAlpha =
                .22 * intensity;

            ctx.fillStyle =
                color;

            ctx.shadowColor =
                color;

            ctx.shadowBlur =
                18 * intensity;

            ctx.beginPath();

            ctx.ellipse(
                x,
                y + 72,
                22,
                7,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();
        }

        /* ---------- ROAD NEON GLOW ---------- */

        function drawNeonEdge() {
            const w =
                gameWidth();

            const h =
                gameHeight();

            ctx.save();

            ctx.globalAlpha = .55;

            ctx.strokeStyle =
                COLORS.cyan;

            ctx.lineWidth = 2;

            ctx.shadowColor =
                COLORS.cyan;

            ctx.shadowBlur = 8;

            ctx.beginPath();

            ctx.moveTo(
                18,
                0
            );

            ctx.lineTo(
                18,
                h
            );

            ctx.moveTo(
                w - 18,
                0
            );

            ctx.lineTo(
                w - 18,
                h
            );

            ctx.stroke();

            ctx.restore();
        }

        /* ---------- PLAYER FLASH ---------- */

        function drawPlayerDamageFlash() {
            if (
                player.hitCooldown <= 0
            ) {
                return;
            }

            /*
             * Blink player sebentar setelah
             * shield menyerap tabrakan.
             */
            if (
                Math.floor(
                    player.hitCooldown / 3
                ) % 2 === 0
            ) {
                ctx.save();

                ctx.globalAlpha = .42;

                ctx.strokeStyle =
                    COLORS.white;

                ctx.lineWidth = 3;

                ctx.beginPath();

                ctx.arc(
                    player.x,
                    player.y +
                        player.height / 2,
                    40,
                    0,
                    Math.PI * 2
                );

                ctx.stroke();

                ctx.restore();
            }
        }

        /* ---------- DRAW PATCH ---------- */

        const finalDraw =
            draw;

        draw = function() {
            finalDraw();

            if (
                isPlaying
            ) {
                drawNeonEdge();
                drawPlayerDamageFlash();
            }
        };

        /* ---------- UPDATE PATCH ---------- */

        const finalUpdate =
            update;

        update = function() {
            if (
                !isPlaying ||
                isPaused ||
                countdownActive
            ) {
                return;
            }

            finalUpdate();

            updatePlayerPolish();
        };

        /* ---------- BUTTON TOUCH FEEDBACK ---------- */

        document
            .querySelectorAll(
                ".control-btn, .btn"
            )
            .forEach(button => {
                button.addEventListener(
                    "touchstart",
                    () => {
                        button.style.transform =
                            "scale(.96)";
                    },
                    { passive: true }
                );

                button.addEventListener(
                    "touchend",
                    () => {
                        button.style.transform =
                            "";
                    },
                    { passive: true }
                );

                button.addEventListener(
                    "touchcancel",
                    () => {
                        button.style.transform =
                            "";
                    },
                    { passive: true }
                );
            });

        /* ---------- PREVENT SCROLLING ---------- */

        document.body.addEventListener(
            "touchmove",
            event => {
                /*
                 * Jangan blokir gesture di input
                 * tertentu, tetapi game area tetap
                 * tidak boleh melakukan page scroll.
                 */
                if (
                    event.target === canvas ||
                    event.target.closest(
                        "#game-container"
                    )
                ) {
                    event.preventDefault();
                }
            },
            { passive: false }
        );

        /* ---------- AUDIO SAFETY ---------- */

        document.addEventListener(
            "visibilitychange",
            () => {
                if (
                    !audioCtx
                ) {
                    return;
                }

                if (
                    document.hidden
                ) {
                    if (
                        audioCtx.state ===
                        "running"
                    ) {
                        audioCtx.suspend()
                            .catch(() => {});
                    }
                } else if (
                    isPlaying &&
                    !isPaused
                ) {
                    audioCtx.resume()
                        .catch(() => {});
                }
            }
        );

        /* ---------- CLEAN RESTART ---------- */

        function resetGameState() {
            score = 0;

            gameSpeed =
                BASE_SPEED;

            roadOffset = 0;

            spawnTimer = 0;
            powerupSpawnTimer = 80;

            combo = 0;
            comboTimer = 0;

            turboTimer = 0;

            activePowerupName =
                "READY";

            powerupMessageTimer =
                0;

            screenShake = 0;
            flashTimer = 0;

            obstacles.length = 0;
            powerups.length = 0;
            particles.length = 0;
            floatingTexts.length = 0;

            player.lane = 1;
            player.shields = 0;
            player.hitCooldown = 0;
            player.moveCooldown = 0;
            player.steeringPunch = 0;

            player.y =
                gameHeight() - 112;

            updateLanePositions(
                true
            );
        }

        /* ---------- GAME RESET OVERRIDE ---------- */

        const cleanStartGame =
            startGame;

        startGame = function() {
            /*
             * Stop previous animation frame.
             */
            if (
                animationId
            ) {
                cancelAnimationFrame(
                    animationId
                );

                animationId = null;
            }

            resetGameState();

            refreshBestScore();

            cleanStartGame();
        };

        /* ---------- GAME OVER PATCH ---------- */

        const cleanGameOver =
            gameOver;

        gameOver = function() {
            if (
                !isPlaying
            ) {
                return;
            }

            cleanGameOver();

            combo = 0;
            comboTimer = 0;

            comboHud.style.opacity =
                "0";

            pauseScreen
                .classList
                .add("hidden");

            bestHud.innerText =
                `BEST: ${highScore}`;
        };

        /* ---------- GAME OVER BUTTON ---------- */

        const playAgainButton =
            document.querySelector(
                "#gameOverScreen .btn"
            );

        if (
            playAgainButton
        ) {
            playAgainButton.addEventListener(
                "click",
                () => {
                    /*
                     * Pastikan pause state tidak
                     * terbawa ke game berikutnya.
                     */
                    isPaused = false;
                    countdownActive = false;

                    pauseScreen
                        .classList
                        .add("hidden");
                }
            );
        }

        /* ---------- DOUBLE START PROTECTION ---------- */

        let startingGame = false;

        const protectedStart =
            startGame;

        startGame = function() {
            if (
                startingGame
            ) {
                return;
            }

            startingGame = true;

            protectedStart();

            setTimeout(() => {
                startingGame = false;
            }, 500);
        };

        /* ---------- INITIAL STATE ---------- */

        refreshBestScore();

        isPlaying = false;
        isPaused = false;
        countdownActive = false;

        /*
         * Pastikan canvas tidak kosong
         * ketika halaman pertama kali dibuka.
         */
        resizeCanvas();

        player.y =
            gameHeight() - 112;

        updateLanePositions(
            true
        );

        draw();

        /* ---------- DEBUG CLEANUP ---------- */

        /*
         * Tidak ada console spam di production.
         * Error audio tetap ditangani secara silent.
         */
        window.addEventListener(
            "error",
            event => {
                if (
                    event &&
                    event.message &&
                    event.message
                        .toLowerCase()
                        .includes("audio")
                ) {
                    event.preventDefault();
                }
            }
        );
